name: M3 R15 learned wave book-disjoint pilot
on:
  push:
    branches: [master]
    paths:
      - 'm3_r15/**'
      - '.github/workflows/m3-r15-learned-wave.yml'
  workflow_dispatch:

jobs:
  learned-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s m3_r15 -p 'test_*.py' -v
      - name: Fetch SHA-256-verified NaNROUTER stories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r15_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER --dir /tmp/m3_r15_corpus
          cd /tmp/m3_r15_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: Fit TRAIN only, evaluate fresh DEV books
        run: |
          python -m m3_r15.learned_wave_readout \
            --corpus-root /tmp/m3_r15_corpus \
            --train-books 4 --dev-books 4 \
            --bytes-per-book 4096 --warmup 1024 \
            --output m3_r15/results/R15_NaNROUTER_DEV.json
      - uses: actions/upload-artifact@v4
        with:
          name: m3-r15-phase-invariant-dev
          path: m3_r15/results/R15_NaNROUTER_DEV.json
