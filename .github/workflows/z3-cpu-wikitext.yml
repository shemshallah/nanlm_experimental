name: Z4 WikiText CPU architecture

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (ubuntu-latest or a registered self-hosted label)
        required: true
        default: ubuntu-latest
        type: string
      steps:
        description: Training steps per architecture row
        required: true
        default: "200"
        type: string
      ctx:
        description: Context length
        required: true
        default: "256"
        type: string
      max_seconds:
        description: Optional wall-clock training cap per row (0 disables)
        required: true
        default: "0"
        type: string
      rows:
        description: JSON array of architecture rows
        required: true
        default: '["concept_full","concept_attention_global","baseline_no_concept","concept_no_mtp_structure","concept_pair_only","concept_no_composition","concept_no_sidecar","concept_loopscale10","concept_router_only","concept_router_no_composition","concept_router_tokens","concept_router_tokens_only"]'
        type: string

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  prepare:
    name: Prepare WikiText-2 token bins
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install preparation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tokenizers
      - name: Download WikiText-2 raw splits on the runner
        run: |
          mkdir -p data
          curl -L --retry 3 --fail \
            -o data/wikitext_train.txt \
            https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/train.txt
          curl -L --retry 3 --fail \
            -o data/wikitext_valid.txt \
            https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/valid.txt
          wc -c data/wikitext_*.txt
      - name: Encode bins with the bundled layered tokenizer
        run: |
          python z3/prepare_cpu_bins.py \
            --train-text data/wikitext_train.txt \
            --valid-text data/wikitext_valid.txt \
            --out data/wikitext_bins \
            --dtype uint16
      - uses: actions/upload-artifact@v4
        with:
          name: wikitext-bins
          path: data/wikitext_bins
          if-no-files-found: error

  train:
    name: Z4 ${{ matrix.row }}
    needs: prepare
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(inputs.rows) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wikitext-bins
          path: data/wikitext_bins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers
      - name: Train and evaluate row
        run: |
          python z3/run_cpu_architecture_row.py \
            --row "${{ matrix.row }}" \
            --train-bin data/wikitext_bins/train.bin \
            --valid-bin data/wikitext_bins/valid.bin \
            --out "rows/${{ matrix.row }}" \
            --steps "${{ inputs.steps || '200' }}" \
            --ctx "${{ inputs.ctx || '256' }}" \
            --max-seconds "${{ inputs.max_seconds || '0' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z3-wikitext-${{ matrix.row }}
          path: |
            rows/${{ matrix.row }}/row_result.json
            rows/${{ matrix.row }}/run.log
          if-no-files-found: warn

  summarize:
    name: Summarize WikiText CPU rows
    needs: train
    if: always()
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: z3-wikitext-*
          path: rows
      - name: Build matrix summary
        run: |
          python - <<'PY'
          import glob, json, pathlib, sys
          rows = []
          for path in sorted(glob.glob('rows/**/row_result.json', recursive=True)):
              rows.append(json.loads(pathlib.Path(path).read_text()))
          out = pathlib.Path('z3_wikitext_summary.json')
          out.write_text(json.dumps(rows, indent=2, sort_keys=True) + '\n')
          for row in rows:
              print(
                  row.get('row'), 'ok=', row.get('ok'),
                  'loss=', row.get('final_loss'),
                  'bpb=', row.get('final_bits_per_byte'),
                  'steps=', row.get('steps_completed'),
                  'nonfinite=', row.get('nonfinite_skips'),
                  'feedback_progress=', row.get('feedback_progress'),
                  'feedback_gate_max_abs=', row.get('feedback_gate_max_abs'),
                  'object_gate=', row.get('object_gate'),
              )
          if not rows or any(not row.get('ok') for row in rows):
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z3-wikitext-summary
          path: z3_wikitext_summary.json
          if-no-files-found: warn
