name: FA2 R24 - single unified PAL and mirror-MoE CPU

on:
  push:
    branches: [master]
    paths:
      - 'fa2r19/source/r24_*.py'
      - 'fa2r19/source/test_r24_unified.py'
      - 'fa2r19/source/test_r23_*.py'
      - 'fa2r19/source/r23_context64.py'
      - 'fa2r19/source/r23_stream_carry.py'
      - 'fa2r19/source/r21_relevance_novelty.py'
      - 'fa2r19/source/r22_multiscale_memory.py'
      - 'fa2r19/docs/FA2_R24_UNIFIED.md'
      - '.github/workflows/fa2-r23-parallel.yml'
  pull_request:
    paths:
      - 'fa2r19/source/r24_*.py'
      - 'fa2r19/source/test_r24_unified.py'
      - 'fa2r19/source/test_r23_*.py'
      - 'fa2r19/source/r23_context64.py'
      - 'fa2r19/source/r23_stream_carry.py'
      - 'fa2r19/source/r21_relevance_novelty.py'
      - 'fa2r19/source/r22_multiscale_memory.py'
      - 'fa2r19/docs/FA2_R24_UNIFIED.md'
      - '.github/workflows/fa2-r23-parallel.yml'
  workflow_dispatch:
    inputs:
      archive_url:
        description: 'Pinned exact original R19 full release ZIP HTTPS URL (blank = source-only)'
        type: string
        default: ''
      steps:
        description: 'Cumulative joint optimizer updates'
        type: number
        default: 100
      chunk_span:
        description: 'Contiguous word chunks per forward pass'
        type: number
        default: 12
      unroll:
        description: 'Consecutive chunks per truncated-BPTT optimizer update'
        type: number
        default: 2
      max_chunks:
        description: 'Available contiguous book chunks per training book'
        type: number
        default: 256
permissions:
  contents: read

jobs:
  unified-source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: python -m pip install torch numpy sentencepiece
      - name: Compile, causality, Adam and streaming tests
        run: |
          python -m compileall -q fa2r19/source
          cd fa2r19/source
          python test_r23_context64.py
          python test_r23_stream_carry.py
          python test_r24_unified.py
      - name: Verify exact accepted R18 digest
        run: |
          python fa2r19/restore_fa2_checkpoint.py --root fa2r19
          python - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('fa2r19/checkpoint/r12_active.pal12')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest=='dd040106568786e7fbad2a880f4010635b626b51c3697e2ab08712905a2de91f'
          print('Accepted FA2 R18 parent immutable:',digest)
          PY

  unified-cpu-training:
    needs: unified-source-gates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.archive_url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ARCHIVE_URL: ${{ inputs.archive_url }}
      STEPS: ${{ inputs.steps }}
      CHUNK_SPAN: ${{ inputs.chunk_span }}
      UNROLL: ${{ inputs.unroll }}
      MAX_CHUNKS: ${{ inputs.max_chunks }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original PAL CPU dependencies
        run: python -m pip install -r fa2r19/requirements.txt
      - name: Validate archive URL and CPU bounds
        run: |
          python - <<'PY'
          import os,urllib.parse
          u=urllib.parse.urlsplit(os.environ['ARCHIVE_URL'])
          assert u.scheme=='https' and u.hostname and not u.username and not u.password
          assert 1<=int(os.environ['STEPS'])<=10000
          assert 1<=int(os.environ['CHUNK_SPAN'])<=64
          assert 1<=int(os.environ['UNROLL'])<=32
          assert int(os.environ['UNROLL'])<=int(os.environ['MAX_CHUNKS'])<=4096
          PY
      - name: Obtain original R19 full archive (tokenizer, verified books and weights)
        run: |
          mkdir -p incoming
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 1800 --output incoming/original-r19.zip "$ARCHIVE_URL"
          python fa2r19/verify_release.py incoming/original-r19.zip --extract work/release
      - name: Overlay unified master source and verified R21/R22 adapter states
        run: |
          cp fa2r19/source/*.py work/release/source/
          python - <<'PY'
          import base64
          from pathlib import Path
          for stem in ('fa2_2_r21_gate_candidate','r22_multiscale_candidate'):
              source=Path('fa2r19/reports')/(stem+'.pth.b64')
              output=Path('work/release/reports')/(stem+'.pth')
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_bytes(base64.b64decode(source.read_text()))
          PY
      - name: Inherited R18/R19 regression and unified source tests
        run: |
          cd work/release
          python source/r18_verify_lineage.py --root .
          python source/test_r18.py .
          python source/test_r19.py --root .
          python source/test_r22_multiscale_memory.py .
          python source/test_r24_unified.py
      - name: Train ONE unified CPU model and ONE optimizer
        run: |
          cd work/release
          python source/r24_unified_cpu.py --root . --steps "$STEPS" --chunk-span "$CHUNK_SPAN" --unroll "$UNROLL" --max-chunks "$MAX_CHUNKS" --threads 2 | tee ../../incoming/fa2-unified.log
      - name: Verify accepted checkpoint remained unchanged
        if: always()
        run: |
          if [ -f work/release/checkpoint/r12_active.pal12 ]; then
            echo "R18 parent:"
            sha256sum work/release/checkpoint/r12_active.pal12
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fa2-r24-single-unified-${{ github.run_id }}
          path: |
            incoming/fa2-unified.log
            work/release/reports/fa2_unified.json
            work/release/reports/fa2_unified_candidate.pth
          retention-days: 30
          if-no-files-found: warn
