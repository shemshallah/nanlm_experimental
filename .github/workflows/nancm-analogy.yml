name: NaNCM v53 causal analogical memory on frozen v50
on:
  push:
    branches: [nancm-structural-base]
    paths: ['tests/nancm_analogy/**', '.github/workflows/nancm-analogy.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nancm-analogy
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python tests/nancm_crossfit/test_crossfit.py
          python -m py_compile tests/nancm_crossfit/pilot51.py
      - name: Download actual public corpus releases and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/{lex,stories,sentences,paragraphs}
          get_archive() {
            local dir="$1" tag="$2" asset="$3" sum="$4"
            (
              cd "data/$dir"
              local base="https://github.com/shemshallah/NaNROUTER/releases/download/$tag"
              curl --fail --location --retry 3 --retry-delay 5 "$base/$asset" -o "$asset"
              curl --fail --location --retry 3 --retry-delay 5 "$base/$sum" -o "$sum"
              sha256sum -c "$sum"
              tar --zstd -xf "$asset"
              rm "$asset"
            )
          }
          get_archive lex wordlist-google-10000-english google-10000-english.tar.zst google-10000-english.SHA256SUMS
          get_archive stories corpora-short-stories-0001 short_stories-0001.tar.zst short_stories-0001.SHA256SUMS
          get_archive sentences corpora-sentences-0001 sentences-0001.tar.zst sentences-0001.SHA256SUMS
          get_archive paragraphs corpora-paragraphs-0001 paragraphs-0001.tar.zst paragraphs-0001.SHA256SUMS
      - name: Recover completed v50 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45914210629 -R ${{ github.repository }} -n hierarchical-field-diagnostic -D parent
      - name: Causal signed analogy preflight
        run: python tests/nancm_analogy/test_analogy.py
      - name: Fit analogical memory on unindexed books and evaluate frozen parent
        run: OPENBLAS_NUM_THREADS=4 OMP_NUM_THREADS=4 python -u tests/nancm_analogy/pilot53.py --data data --checkpoint parent/hierarchical-metrics.pt --parent-metrics parent/hierarchical-metrics.json --out analogy-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analogy-cooperative-diagnostic
          path: |
            analogy-metrics.json
            analogy-metrics.pt
