name: FA1 R7.53 - causal successor and checkpoint topology

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fa1-r753-causal-successor.yml'
      - 'fa1r7.12/source/fa1_r753_*.py'
      - 'fa1r7.12/source/test_fa1_r753_*.py'
      - 'fa1r7.12/source/fa1_r727_checkpoint.py'
      - 'fa1r7.12/source/fa1_r721_joint_train.py'
      - 'fa1r7.12/source/fa1_r723_train.py'
      - 'fa1r7.12/FA1_R7p53_RECOVERY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa1-r753-source-master
  cancel-in-progress: false

jobs:
  causal-successor-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: fa1r7.12/source
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install numpy sentencepiece zstandard
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile extended checkpoint and causal source
        run: |
          python -m py_compile fa1r7.12/source/fa1_r753_*.py
          python -m py_compile fa1r7.12/source/fa1_r727_checkpoint.py
          python -m py_compile fa1r7.12/source/fa1_r721_joint_train.py
          python -m py_compile fa1r7.12/source/fa1_r723_train.py
      - name: Run R7.53 and inherited source controls
        run: |
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r753_*.py' -v
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r751_*.py' -v
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r749_*.py' -v
      - name: No checkpoint promotion or independent TEST opening
        run: |
          echo 'Source-only CI; R7.49 checkpoint immutable; DEV gate and sealed TEST unchanged.'
