name: FA2 R52 - Reversible Reciprocal Gain and Address Sweep

on:
  push:
    branches: [master]
    paths:
      - 'poincare_mirror/scripts/probe_r52_gain_address.py'
      - 'poincare_mirror/geometry_address_controls.py'
      - 'poincare_mirror/scripts/probe_r50_geometry_addresses.py'
      - 'poincare_mirror/tests/test_r52_gain_address.py'
      - '.github/workflows/fa2-r52-gain-address.yml'
  workflow_dispatch:

jobs:
  causal-gain-and-address-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile source
        run: python -m compileall -q poincare_mirror
      - name: Test R52 and precursor contracts
        run: |
          cd poincare_mirror
          python -m unittest discover -s tests -p 'test_r52_gain_address.py' -v
          python -m unittest discover -s tests -p 'test_r50_geometry_addresses.py' -v
          python -m unittest discover -s tests -p 'test_r51_address_contrast.py' -v
          python -m unittest discover -s tests -p 'test_r49_causal_history.py' -v
          python -m unittest discover -s tests -p 'test_r47_selective_emission.py' -v
