name: FA1 R7.29 - context-addressed geometric readout

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fa1-r729-contextual-geometry.yml'
      - 'fa1r7.12/source/fa1_r729_*.py'
      - 'fa1r7.12/source/test_fa1_r729_*.py'
      - 'fa1r7.12/source/fa1_r728_geometric_memory.py'
      - 'fa1r7.12/source/fa1_r727_checkpoint.py'
      - 'fa1r7.12/FA1_R7p29_CONTEXTUAL_GEOMETRY.md'
      - 'fa1r7.12/reports/FA1_R729_*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa1-r729-master-cpu-source
  cancel-in-progress: false

jobs:
  contextual-memory-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: fa1r7.12/source
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install numpy sentencepiece zstandard
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run signed memory unit tests
        run: |
          python -m py_compile fa1r7.12/source/fa1_r729_*.py
          python -m py_compile fa1r7.12/source/fa1_r728_geometric_memory.py
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r729_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r728_*.py' -q
      - name: Run inherited seven-level R7 regression suite
        run: |
          python fa1r7.12/source/fa1_r727_suite.py --output "$RUNNER_TEMP/r729_r727_regression.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fa1-r729-source-regressions
          path: ${{ runner.temp }}/r729_r727_regression.json
          retention-days: 30
      - name: Gate
        run: echo 'No automatic checkpoint promotion. Full-model real-weight benchmark is separate.'
