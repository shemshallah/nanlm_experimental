name: NaNROUTER FineWeb-Edu 4h CPU

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub runner label (ubuntu-latest) or registered self-hosted label
        required: true
        default: ubuntu-latest
        type: string
      slice_mb:
        description: Raw FineWeb-Edu slice size in MB
        required: true
        default: "64"
        type: string
      steps:
        description: Training-step cap
        required: true
        default: "8000"
        type: string
      max_seconds:
        description: Wall-clock training cap
        required: true
        default: "14400"
        type: string
      ctx:
        description: Context length
        required: true
        default: "256"
        type: string
      row:
        description: Architecture row
        required: true
        default: concept_router_tokens
        type: choice
        options:
          - concept_router_tokens
          - concept_frontier
          - concept_router_tokens_mix
          - concept_router_tokens_object_id

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  prepare:
    name: Prepare FineWeb-Edu slice
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tokenizers pyarrow
      - name: Download public FineWeb-Edu range from Kaggle
        env:
          SLICE_MB: ${{ inputs.slice_mb || '64' }}
        run: |
          mkdir -p data
          slice_end=$(( SLICE_MB * 1024 * 1024 - 1 ))
          url='https://www.kaggle.com/api/v1/datasets/download/nameonlu/fineweb-edu/fineweb_edu_0000.txt'
          if ! curl -L --fail --retry 3 --range "0-${slice_end}" \
              -o data/fineweb_edu.txt "$url"; then
            echo "Kaggle range download failed; using public HF parquet fallback"
            curl -L --retry 3 --fail -o data/fineweb_edu.parquet \
              https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu/resolve/main/sample/10BT/000_00000.parquet
            python z3/parquet_to_text.py \
              --input data/fineweb_edu.parquet \
              --output data/fineweb_edu.txt
          fi
          ls -lh data/fineweb_edu.txt
      - name: Slice into train and validation text
        env:
          SLICE_MB: ${{ inputs.slice_mb || '64' }}
        run: |
          python z3/prepare_fineweb_slice.py \
            --input data/fineweb_edu.txt \
            --out-dir data \
            --slice-mb "$SLICE_MB" \
            --valid-fraction 0.04
      - name: Encode bins with the layered tokenizer
        run: |
          python z3/prepare_cpu_bins.py \
            --train-text data/train.txt \
            --valid-text data/valid.txt \
            --out data/fineweb_bins \
            --dtype uint16
      - uses: actions/upload-artifact@v4
        with:
          name: nanrouter-fineweb-bins
          path: |
            data/fineweb_bins
            data/train.txt
            data/valid.txt
          if-no-files-found: error

  train:
    name: NaNROUTER 4h CPU training
    needs: prepare
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nanrouter-fineweb-bins
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers
      - name: Train NaNROUTER with token router and probes
        run: |
          python z3/run_cpu_architecture_row.py \
            --row "${{ inputs.row || 'concept_router_tokens' }}" \
            --train-bin data/fineweb_bins/train.bin \
            --valid-bin data/fineweb_bins/valid.bin \
            --out run \
            --steps "${{ inputs.steps || '8000' }}" \
            --ctx "${{ inputs.ctx || '256' }}" \
            --max-seconds "${{ inputs.max_seconds || '14400' }}" \
            --timeout 18000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanrouter-fineweb-checkpoint
          path: |
            run/row_result.json
            run/run.log
            run/history.json
            run/result.json
            run/final.pt
            run/best.pt
            run/config.json
          if-no-files-found: warn

  evaluate:
    name: Zero-shot WT2 and WT103
    needs: train
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nanrouter-fineweb-checkpoint
          path: trained
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers pyarrow
      - name: Download WT2 test and WT103 test
        run: |
          mkdir -p eval_data
          curl -L --retry 3 --fail -o eval_data/wt2_test.txt \
            https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/test.txt
          curl -L --retry 3 --fail -o eval_data/wt103.parquet \
            https://huggingface.co/datasets/Salesforce/wikitext/resolve/main/wikitext-103-raw-v1/test-00000-of-00001.parquet
          python z3/parquet_to_text.py \
            --input eval_data/wt103.parquet \
            --output eval_data/wt103_test.txt
          wc -c eval_data/wt2_test.txt eval_data/wt103_test.txt
      - name: Locate checkpoint and run zero-shot evaluation
        run: |
          checkpoint=$(find trained -name final.pt | head -1)
          test -n "$checkpoint"
          python z3/eval_v3.py \
            --checkpoint "$checkpoint" \
            --corpus wt2=eval_data/wt2_test.txt \
            --corpus wt103=eval_data/wt103_test.txt \
            --tokenizer layered \
            --ctx "${{ inputs.ctx || '256' }}" \
            --full \
            --batch-size 4 \
            --device cpu \
            --out eval_zero_shot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanrouter-zero-shot-eval
          path: |
            eval_zero_shot.json
            eval_data/wt2_test.txt
            eval_data/wt103_test.txt
          if-no-files-found: warn
