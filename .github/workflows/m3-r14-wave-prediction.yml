name: M3 R14 causal wave prediction pilot
on:
  push:
    branches: [master]
    paths:
      - 'm3_r13/**'
      - 'm3_r14/**'
      - '.github/workflows/m3-r14-wave-prediction.yml'
  workflow_dispatch:

jobs:
  prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s m3_r13 -p 'test_*.py' -v
      - run: python -m unittest discover -s m3_r14 -p 'test_*.py' -v
      - name: Download SHA-256-verifiable NaNROUTER short stories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER --dir /tmp/m3_corpus
          cd /tmp/m3_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: Frozen-gain book-disjoint predictive attribution
        run: |
          python -m m3_r14.predictive_probe \
            --corpus-root /tmp/m3_corpus \
            --train-books 4 --dev-books 4 \
            --bytes-per-book 768 --warmup 256 \
            --output m3_r14/results/R14_NaNROUTER_DEV.json
      - uses: actions/upload-artifact@v4
        with:
          name: m3-r14-book-disjoint-dev
          path: m3_r14/results/R14_NaNROUTER_DEV.json
