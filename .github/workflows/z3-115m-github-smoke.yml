name: Z3 115M GitHub CPU smoke

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (ubuntu-latest or a self-hosted GPU label)"
        required: true
        default: ubuntu-latest
        type: string
      steps:
        description: "Optimizer steps for the 115M smoke"
        required: true
        default: "1"
        type: string
      preset:
        description: "Training preset (115m or kaggle10m)"
        required: true
        default: "115m"
        type: string
      run_tests:
        description: "Run the full z3 unit suite first"
        required: true
        default: true
        type: boolean
      ctx:
        description: "Context length for the 115M run"
        required: true
        default: "8"
        type: string
      eval_every:
        description: "Evaluation interval in steps"
        required: true
        default: "50"
        type: string
      best_every:
        description: "Write best.pt every N steps (0 uses the preset value)"
        required: true
        default: "0"
        type: string
      feedback_warmup:
        description: "Feedback gate warmup steps (-1 uses the preset value)"
        required: true
        default: "-1"
        type: string
      max_seconds:
        description: "Optional wall-clock cap in seconds (0 disables)"
        required: true
        default: "0"
        type: string
      require_feedback_open:
        description: "Fail validation unless at least one feedback gate opens"
        required: true
        default: false
        type: boolean

concurrency:
  group: z3-115m-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  z3-115m-cpu-smoke:
    name: Z3 115M wiring smoke (CPU)
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch and data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers

      - name: Run z3 unit suite
        if: ${{ inputs.run_tests }}
        run: |
          python -m unittest discover -s z3 -p 'test_*.py' -v

      - name: Build a tiny document-disjoint corpus
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/z3_115m_ci')
          root.mkdir(parents=True, exist_ok=True)
          for name in ('alpha', 'beta', 'gamma'):
              docs = [
                  f'{name} document {i}. This is a short held-out-safe paragraph '
                  f'with a few words, a number {i}, and a closing sentence.'
                  for i in range(24)
              ]
              (root / f'{name}.txt').write_text('\n\n'.join(docs) + '\n', encoding='utf-8')
          PY
          python z3/build_domain_bins.py \
            --corpus alpha=/tmp/z3_115m_ci/alpha.txt \
            --corpus beta=/tmp/z3_115m_ci/beta.txt \
            --corpus gamma=/tmp/z3_115m_ci/gamma.txt \
            --out /tmp/z3_115m_bins \
            --train-fraction 0.70 --valid-fraction 0.15 \
            --min-doc-bytes 1

      - name: Verify 115M preset and full feedback forward
        run: |
          PYTHONPATH=z3 python - <<'PY'
          import torch
          from train_v3 import build_parser, apply_preset, make_config
          from v3_model import V3LM
          argv = ['--preset', '115m', '--corpus', 'unused']
          parser = build_parser()
          args = parser.parse_args(argv)
          apply_preset(args, argv)
          cfg = make_config(args, 64060)
          model = V3LM(cfg).eval()
          assert model.parameter_count() == 115_238_237, model.parameter_count()
          model.set_feedback_progress(1.0)
          with torch.no_grad():
              logits, mtp, aux = model(torch.randint(0, 64060, (1, 8)))
          assert tuple(logits.shape) == (1, 8, 64060), logits.shape
          assert len(mtp) == 2, len(mtp)
          assert aux.get('feedback', {}).get('progress') is not None
          print({'params': model.parameter_count(), 'logits': tuple(logits.shape),
                 'mtp_heads': len(mtp), 'feedback': {k: float(v) for k, v in aux['feedback'].items()}})
          PY

      - name: One-step 115M train -> per-domain test -> validate
        env:
          CTX: ${{ inputs.ctx || '8' }}
          EVAL_EVERY: ${{ inputs.eval_every || '50' }}
          BEST_EVERY: ${{ inputs.best_every || '0' }}
          FEEDBACK_WARMUP: ${{ inputs.feedback_warmup || '-1' }}
          MAX_SECONDS: ${{ inputs.max_seconds || '0' }}
          REQUIRE_FEEDBACK_OPEN: ${{ inputs.require_feedback_open }}
          PRESET: ${{ inputs.preset || '115m' }}
        run: |
          EXTRA=()
          if [ "$BEST_EVERY" != "0" ]; then
            EXTRA+=(--best-every "$BEST_EVERY")
          fi
          if [ "$FEEDBACK_WARMUP" != "-1" ]; then
            EXTRA+=(--feedback-gate-warmup-steps "$FEEDBACK_WARMUP")
          fi
          if [ "$MAX_SECONDS" != "0" ]; then
            EXTRA+=(--max-seconds "$MAX_SECONDS")
          fi

          python z3/train_v3.py --preset "$PRESET" \
            --corpus /tmp/z3_115m_bins/train.bin \
            --val-corpus /tmp/z3_115m_bins/valid.bin \
            --data-manifest /tmp/z3_115m_bins/manifest.json \
            --tokenizer bin --ctx "$CTX" --batch-size 1 \
            --steps "${{ inputs.steps || '1' }}" \
            --eval-every "$EVAL_EVERY" --eval-batches 1 --log-every 1 \
            --no-ema --no-grad-checkpoint \
            --device cpu --threads 2 \
            --out /tmp/z3_115m_run \
            "${EXTRA[@]}"

          python z3/eval_domains.py \
            --checkpoint /tmp/z3_115m_run/best.pt \
            --test-dir /tmp/z3_115m_bins/test \
            --data-manifest /tmp/z3_115m_bins/manifest.json \
            --tokenizer layered --document-framing --sidecar --require-sidecar \
            --ctx "$CTX" --batch-size 1 --device cpu \
            --out /tmp/z3_115m_run/test_domains.json

          VALIDATE=()
          if [ "$REQUIRE_FEEDBACK_OPEN" = "true" ]; then
            VALIDATE+=(--require-feedback-open)
          fi
          python z3/validate_run.py \
            --run /tmp/z3_115m_run \
            --test /tmp/z3_115m_run/test_domains.json \
            --expected-params 115238237 \
            --out /tmp/z3_115m_run/validation.json \
            "${VALIDATE[@]}"

      - name: Publish 115M result summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          run = Path('/tmp/z3_115m_run')
          print('## Z4 115M CPU run')
          print()
          print('| Metric | Value |')
          print('|---|---:|')
          for name in ('result.json', 'test_domains.json', 'validation.json'):
              path = run / name
              if not path.is_file():
                  print(f'| {name} | missing |')
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              if name == 'result.json':
                  print(f'| Params | {data.get("params")} |')
                  print(f'| Steps | {data.get("steps_completed")} |')
                  print(f'| Non-finite skips | {data.get("nonfinite_skips")} |')
                  print(f'| Feedback warmup | {data.get("feedback_gate_warmup_steps")} |')
                  print(f'| Feedback progress | {data.get("feedback_progress_final")} |')
                  feedback = (data.get('final') or {}).get('feedback') or {}
                  print(f'| Max abs feedback gate | {max((abs(float(v)) for k, v in feedback.items() if k.endswith("gate")), default=0.0):.6f} |')
              elif name == 'test_domains.json':
                  print(f'| Macro BPB | {data.get("macro_bits_per_byte")} |')
                  aggregate = data.get('aggregate') or {}
                  feedback = aggregate.get('feedback') or {}
                  print(f'| Eval max abs gate | {max((abs(float(v)) for k, v in feedback.items() if k.endswith("gate")), default=0.0):.6f} |')
                  print(f'| Object gate | {(aggregate.get("object_memory") or {}).get("object_gate")} |')
              else:
                  print(f'| Validation | ok={data.get("ok")} errors={len(data.get("errors", []))} warnings={len(data.get("warnings", []))} |')
          PY

      - name: Collect smoke artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp /tmp/z3_115m_run/config.json artifacts/ || true
          cp /tmp/z3_115m_run/result.json artifacts/ || true
          cp /tmp/z3_115m_run/history.json artifacts/ || true
          cp /tmp/z3_115m_run/test_domains.json artifacts/ || true
          cp /tmp/z3_115m_run/validation.json artifacts/ || true
          cp /tmp/z3_115m_bins/manifest.json artifacts/ || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z3-115m-github-smoke
          path: artifacts/
          if-no-files-found: warn
