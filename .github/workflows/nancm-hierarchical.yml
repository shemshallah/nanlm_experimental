name: NaNCM v50 signed hierarchical field corpus diagnostic
on:
  push:
    branches: [nancm-structural-base]
    paths: ['tests/nancm_hierarchical/**', '.github/workflows/nancm-hierarchical.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nancm-hierarchical
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python tests/nancm_hierarchical/hierarchical_field.py
          python -m py_compile tests/nancm_hierarchical/pilot50.py
      - name: Download actual public corpus releases and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/{lex,stories,sentences,paragraphs}
          get_archive() {
            local dir="$1" tag="$2" asset="$3" sum="$4"
            (
              cd "data/$dir"
              local base="https://github.com/shemshallah/NaNROUTER/releases/download/$tag"
              curl --fail --location --retry 3 --retry-delay 5 "$base/$asset" -o "$asset"
              curl --fail --location --retry 3 --retry-delay 5 "$base/$sum" -o "$sum"
              sha256sum -c "$sum"
              tar --zstd -xf "$asset"
              rm "$asset"
            )
          }
          get_archive lex wordlist-google-10000-english google-10000-english.tar.zst google-10000-english.SHA256SUMS
          get_archive stories corpora-short-stories-0001 short_stories-0001.tar.zst short_stories-0001.SHA256SUMS
          get_archive sentences corpora-sentences-0001 sentences-0001.tar.zst sentences-0001.SHA256SUMS
          get_archive paragraphs corpora-paragraphs-0001 paragraphs-0001.tar.zst paragraphs-0001.SHA256SUMS
      - name: Reference-only signed field fitting and matched held-out evaluation
        run: python -u tests/nancm_hierarchical/pilot50.py --data data --out hierarchical-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hierarchical-field-diagnostic
          path: |
            hierarchical-metrics.json
            hierarchical-metrics.pt
