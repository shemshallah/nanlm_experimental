name: FA2 R30 - Sparse Diamond Overmind
on:
  push:
    paths:
      - 'fa2r19/source/r30_*'
      - 'fa2r19/source/test_r30_*'
      - 'fa2r19/source/r24_unified_model.py'
      - 'fa2r19/docs/FA2_R30_DIAMOND_OVERMIND.md'
      - '.github/workflows/fa2-r30-diamond.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diamond-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile inherited model and R30
        run: python -m compileall -q fa2r19/source
      - name: Install CPU Torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Overmind identity, topology, causal and backward checks
        run: python fa2r19/source/test_r30_diamond_overmind.py
