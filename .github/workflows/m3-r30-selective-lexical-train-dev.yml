name: M3 R30 selective lexical router CPU TRAIN GATE DEV
on:
  push:
    branches: [master]
    paths:
      - 'm3_r30/**'
      - '.github/workflows/m3-r30-selective-lexical-train-dev.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m3-r30-lexical-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Prove R29 unified fallback and R30 causal zero-init parity
        run: |
          python -m compileall -q m3_default m3_r29 m3_r30
          python -m unittest discover -s m3_default -p 'test_*.py' -v
          python -m unittest discover -s m3_r29 -p 'test_*.py' -v
          python -m unittest discover -s m3_r30 -p 'test_*.py' -v
      - name: Recover and hash-check complete R29 22-group optimizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r30_parent
          gh run download 44184424516 -R shemshallah/nanlm_experimental \
            -n m3-r29-lexical-full-adam-and-dev -D /tmp/m3_r30_parent
          printf '%s  %s\n' \
            02c340e82ec77ae2c6e1d20ddd808ca4f63e3c242fe6fc94ff8f2235d8ab9386 \
            /tmp/m3_r30_parent/R29_full_adam_checkpoint.npz | sha256sum -c -
      - name: Download and SHA-verify NaNROUTER public-domain books
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r30_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER \
            --dir /tmp/m3_r30_corpus
          cd /tmp/m3_r30_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: Train three new router gains; evaluate both matched/null history controls
        run: |
          python -m m3_r30.train_dev \
            --corpus-root /tmp/m3_r30_corpus \
            --parent-checkpoint /tmp/m3_r30_parent/R29_full_adam_checkpoint.npz \
            --output m3_r30/results/R30_DEV.json \
            --checkpoint m3_r30/results/R30_full_adam_checkpoint.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-r30-25-group-optimizer-and-matched-history-dev
          path: m3_r30/results/
          if-no-files-found: warn
