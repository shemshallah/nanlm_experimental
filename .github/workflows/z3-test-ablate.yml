name: Z4 tests and ablation

on:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label. Use ubuntu-latest, or a registered self-hosted label
          such as NaNLMind.
        required: true
        default: ubuntu-latest
        type: string
      steps:
        description: Training steps per ablation row
        required: true
        default: "8"
        type: string

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  z4-tests:
    name: Z4 CPU unit and smoke tests
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers
      - name: Run Z4 test suite
        run: |
          python -m unittest discover -s z3 -p 'test_*.py' -v

  z4-ablation:
    name: Z4 wiring ablation matrix
    needs: z4-tests
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and ablation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy tokenizers
      - name: Run concept, pointer, MTP, and domain ablations
        run: |
          python z3/run_ablation_matrix.py \
            --out z3_ablation_ci \
            --steps "${{ inputs.steps || '8' }}"
      - name: Upload ablation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z3-ablation-summary
          path: |
            z3_ablation_ci/summary.json
            z3_ablation_ci/*/run.log
            z3_ablation_ci/corpus_*.log
          if-no-files-found: warn
