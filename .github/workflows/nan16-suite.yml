name: NaN16 SQLite official suite

on:
  workflow_dispatch:
    inputs:
      ref:
        description: nan0s branch, tag or SHA
        required: true
        default: ci/nan16-suite-final
      mode:
        description: select1 | slices | veryquick | oracle
        required: true
        default: select1
      mem:
        description: guest MiB for the testfixture/S1
        required: true
        default: "384"

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NAN0S_REF: ${{ inputs.ref }}
      MODE: ${{ inputs.mode }}
      MEM: ${{ inputs.mem }}
      S1_QEMU_ACCEL: kvm
    steps:
      - name: Checkout nan0s
        uses: actions/checkout@v4
        with:
          repository: shemshallah/nan0s
          ref: ${{ inputs.ref }}
          path: nan0s

      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm qemu-system-x86 unzip curl

      - name: Fetch pinned Tcl 9.0.3 and SQLite 3.54.1
        working-directory: nan0s
        run: sh tools/fetch_tcl_sqlite_suite.sh "$RUNNER_TEMP/tcl-sqlite"

      - name: Build portable nan_cli (oracle mode only)
        if: inputs.mode == 'oracle'
        working-directory: nan0s
        run: make -C aarch64/android -j2

      - name: Build official testfixture (select1 gate)
        working-directory: nan0s
        env:
          TCL_SRC: ${{ runner.temp }}/tcl-sqlite/tcl9.0.3
          SQLITE_SRC: ${{ runner.temp }}/tcl-sqlite/sqlite-src-3540100
          TCL_NAN16_TESTFIXTURE_RUNNER: ${{ inputs.mode == 'oracle' && format('{0}/nan0s/aarch64/android/nan_cli', github.workspace) || format('{0}/nan0s/tools/s1_runner.sh', github.workspace) }}
          TCL_NAN16_TESTFIXTURE_ALLOW_ORACLE: ${{ inputs.mode == 'oracle' && '1' || '0' }}
          TCL_NAN16_TESTFIXTURE_MEM: ${{ inputs.mem }}
          S1_QEMU_TIMEOUT: "3600"
          TCL_NAN16_TESTFIXTURE_STEPS: "20000000000"
          TCL_NAN16_TESTFIXTURE_TEST: /sqlite/test/select1.test
          TCL_NAN16_TESTFIXTURE_OUT: ${{ github.workspace }}/nan0s/product-final.bin
        run: sh tools/nan16_testfixture_gate.sh | tee testfixture-build.log

      - name: Official slices
        if: inputs.mode == 'slices' || inputs.mode == 'veryquick' || inputs.mode == 'oracle'
        working-directory: nan0s
        env:
          S1_QEMU_TIMEOUT: "3600"
        run: |
          set -u
          mkdir -p out
          if [ "$MODE" = oracle ]; then
            RUN="$PWD/aarch64/android/nan_cli"; CLOCK="--clock steps:100000"
            echo "ORACLE MODE: nan16.c C model, not S1" | tee out/MODE
          else
            RUN="$PWD/tools/s1_runner.sh"; CLOCK=""
            echo "S1 MODE: raw NaN16 on x86_64 S1" | tee out/MODE
          fi
          run() {
            name=$1; path=$2; steps=$3
            mkdir -p "out/$name"
            "$RUN" --img product-final.bin --mem "$MEM" --steps "$steps" $CLOCK \
              --guest-script "$path" \
              --guest-stdout "out/$name/out" --guest-stderr "out/$name/err" \
              --peek 0x100:1 > "out/$name/peek" 2> "out/$name/run.err" || true
            printf '%-14s %s\n' "$name" "$(grep -E '[0-9]+ errors out of' "out/$name/out" | tail -1)"
          }
          run select1        /sqlite/test/select1.test                  20000000000
          run recoverpgsz    /sqlite/ext/recover/recoverpgsz.test      12000000000
          run recovercorrupt3 /sqlite/ext/recover/recovercorrupt3.test  5000000000
          run backup2        /sqlite/test/backup2.test                   5000000000
          run busy2          /sqlite/test/busy2.test                     2000000000
          run cache          /sqlite/test/cache.test                     5000000000
          run date           /sqlite/test/date.test                     30000000000
          run capi3          /sqlite/test/capi3.test                    20000000000
          run chunksize      /sqlite/test/chunksize.test                 3000000000
          run cksumvfs       /sqlite/test/cksumvfs.test                 80000000000
          run symlink        /sqlite/test/symlink.test                  10000000000
          run wal            /sqlite/test/wal.test                      40000000000

      - name: veryquick aggregate (nan_cli oracle, not S1)
        if: inputs.mode == 'oracle'
        working-directory: nan0s
        env:
          NAN16_CLI: ${{ github.workspace }}/nan0s/aarch64/android/nan_cli
          NAN16_SUITE_MEM: ${{ inputs.mem }}
          NAN16_CLOCK: steps:100000
          NAN16_SUITE_CHECKPOINT_SECONDS: "60"
        run: |
          mkdir -p suite
          echo "ORACLE MODE: nan16.c C model, not S1" | tee suite/MODE
          sh tools/nan16_suite_resume.sh product-final.bin suite/veryquick.nan1 \
            /sqlite/test/veryquick.test suite | tee suite/summary.log

      - name: veryquick aggregate (one S1 process, raw NaN)
        if: inputs.mode == 'veryquick'
        working-directory: nan0s
        env:
          S1_QEMU_TIMEOUT: "21600"
        run: |
          mkdir -p suite
          ./tools/s1_runner.sh --img product-final.bin --mem "$MEM" --steps unlimited \
            --guest-script /sqlite/test/veryquick.test \
            --guest-stdout suite/out --guest-stderr suite/err \
            --peek '0x100:1' > suite/peek 2> suite/run.err
          grep -E '[0-9]+ errors out of' suite/out | tail -1 | tee suite/summary.txt

      - name: Boot the same image on x86_64 S1 (QEMU, select1 spot check)
        if: inputs.mode == 'slices'
        working-directory: nan0s
        run: |
          mkdir -p s1
          S1_QEMU_TIMEOUT=3600 ./tools/s1_runner.sh \
            --img product-final.bin --mem "$MEM" --steps 20000000000 \
            --guest-script /sqlite/test/select1.test \
            --guest-stdout s1/out --guest-stderr s1/err --peek '0x100:1' \
            > s1/peek 2> s1/run.err
          cat s1/peek
          grep -E '[0-9]+ errors out of' s1/out | tail -1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nan16-${{ inputs.mode }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            nan0s/product-final.bin
            nan0s/testfixture-build.log
            nan0s/out
            nan0s/suite
            nan0s/s1
