name: Terminal-RSI v102 byte-specialist independent corpus checks

on:
  push:
    branches: [master]
    paths:
      - 'terminal_rsi/byte_specialist/**'
      - 'terminal_rsi/tests/test_byte_specialist.py'
      - '.github/workflows/terminal-rsi-v102-byte.yml'
  workflow_dispatch:
    inputs:
      train_books:
        description: 'Download SHA-verified NaNROUTER books and run CPU source training'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verified-source-and-splits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Verify exact donor and independent byte windows
        run: python -m unittest discover -s terminal_rsi/tests -v

  train-real-nanrouter-books:
    if: github.event_name == 'workflow_dispatch' && inputs.train_books
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Download and verify original Gutenberg book release
        run: |
          mkdir -p corpus/books
          curl -fsSL --retry 3 -o corpus/books.tar.zst \
            https://github.com/shemshallah/NaNROUTER/releases/download/corpora-short-stories-0004/short_stories-0004.tar.zst
          echo 'd6ce3a23757e85fe1b9487ef984a5ba81db9c2dc6e962ac7c5df2960480e0054  corpus/books.tar.zst' | sha256sum -c
          tar --zstd -xf corpus/books.tar.zst -C corpus/books
      - name: Prepare disjoint train, DEV and sealed TEST books
        run: |
          python -m terminal_rsi.byte_specialist.controller prep \
            --corpus corpus/books --work corpus/work --maxb 1000000
      - name: Train, select by DEV, independently measure TEST
        run: |
          python -m terminal_rsi.byte_specialist.controller search --work corpus/work
          python -m terminal_rsi.byte_specialist.controller audit --work corpus/work
      - name: Train persistent host residual with distinct second dev and test books
        run: |
          python -m terminal_rsi.byte_specialist.residual prepare \
            --corpus corpus/books --work corpus/work
          python -m terminal_rsi.byte_specialist.residual tap-batch \
            --work corpus/work --splits calibration dev2 test2
          python -m terminal_rsi.byte_specialist.residual train \
            --work corpus/work
      - name: Continue inherited Adam into causal previous-byte specialist
        run: |
          python -m terminal_rsi.byte_specialist.contextual prepare \
            --corpus corpus/books --work corpus/work
          python -m terminal_rsi.byte_specialist.residual tap-batch \
            --work corpus/work --splits dev3 test3
          python -m terminal_rsi.byte_specialist.contextual train \
            --work corpus/work
      - name: Train new confidence trust group with original optimizer moments intact
        run: |
          python -m terminal_rsi.byte_specialist.trustgate train \
            --work corpus/work
          python -m terminal_rsi.byte_specialist.trustgate evaluate \
            --work corpus/work --split test3
      - name: Extend the inherited model with strictly causal multiscale recall
        run: |
          python -m terminal_rsi.byte_specialist.causal_echo train \
            --work corpus/work
      - name: Train the recurrent RSI critic/controller as the final prediction path
        run: |
          python -m terminal_rsi.byte_specialist.feedback_core train \
            --work corpus/work
      - name: Continue the same RSI optimizer with rank-preserving feedback calibration
        run: |
          python -m terminal_rsi.byte_specialist.feedback_core temperature-train \
            --work corpus/work
      - name: Label previously inspected cross-book comparisons as post-hoc only
        run: |
          python -m terminal_rsi.byte_specialist.feedback_core temperature-legacy-diagnostic \
            --work corpus/work
      - name: Verify frozen-donor live RSI replay and checkpoint resumption
        run: |
          python -m terminal_rsi.byte_specialist.stream_bridge \
            --work corpus/work --split test3 --resume-every 160 \
            --checkpoint corpus/work/rsi_temperature_candidate.npz
      - name: Prepare two independent untouched-book evaluations
        run: |
          python -m terminal_rsi.byte_specialist.contextual prepare-guard \
            --corpus corpus/books --work corpus/work
          python -m terminal_rsi.byte_specialist.holdout prepare \
            --corpus corpus/books --work corpus/work --books 64
      - name: Replay v102 once for DEV4 and 64-book holdout
        run: |
          python -m terminal_rsi.byte_specialist.residual tap-batch \
            --work corpus/work --splits dev4 holdout4 --diskctx
      - name: Validate top-k guard on additional completely unseen books
        run: |
          python -m terminal_rsi.byte_specialist.contextual eval-guard \
            --work corpus/work
          python -m terminal_rsi.byte_specialist.trustgate evaluate \
            --work corpus/work --split dev4
          python -m terminal_rsi.byte_specialist.causal_echo evaluate \
            --work corpus/work --split dev4
          python -m terminal_rsi.byte_specialist.feedback_core evaluate \
            --work corpus/work --split dev4
          python -m terminal_rsi.byte_specialist.feedback_core temperature-evaluate \
            --work corpus/work --split dev4
          python -m terminal_rsi.byte_specialist.stream_bridge \
            --work corpus/work --split dev4 --resume-every 160 \
            --checkpoint corpus/work/rsi_temperature_candidate.npz
      - name: Independent never-trained 64-book remainder audit
        run: |
          python -m terminal_rsi.byte_specialist.holdout evaluate \
            --work corpus/work
          python -m terminal_rsi.byte_specialist.trustgate evaluate \
            --work corpus/work --split holdout4
          python -m terminal_rsi.byte_specialist.causal_echo evaluate \
            --work corpus/work --split holdout4
          python -m terminal_rsi.byte_specialist.feedback_core evaluate \
            --work corpus/work --split holdout4
          python -m terminal_rsi.byte_specialist.feedback_core temperature-evaluate \
            --work corpus/work --split holdout4
          python -m terminal_rsi.byte_specialist.stream_bridge \
            --work corpus/work --split holdout4 --resume-every 160 \
            --checkpoint corpus/work/rsi_temperature_candidate.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-rsi-v102-byte-source-checks-and-results
          path: |
            corpus/work/split_manifest.json
            corpus/work/specialist_search.json
            corpus/work/residual_manifest.json
            corpus/work/residual_search.json
            corpus/work/residual_checkpoint.npz
            corpus/work/context_manifest.json
            corpus/work/context_search.json
            corpus/work/context_candidate_step*.npz
            corpus/work/guard_manifest.json
            corpus/work/guard_search.json
            corpus/work/holdout_manifest.json
            corpus/work/holdout_search.json
            corpus/work/trust_search.json
            corpus/work/trust_candidate.npz
            corpus/work/trust_*_search.json
            corpus/work/echo_search.json
            corpus/work/echo_candidate.npz
            corpus/work/echo_*_search.json
            corpus/work/rsi_search.json
            corpus/work/rsi_candidate.npz
            corpus/work/rsi_*_search.json
            corpus/work/rsi_temperature_candidate.npz
            corpus/work/rsi_temperature_search.json
            corpus/work/rsi_temperature_legacy_diagnostic.json
            corpus/work/rsi_live_*_replay.json
          retention-days: 14
