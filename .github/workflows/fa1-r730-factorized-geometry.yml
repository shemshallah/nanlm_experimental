name: FA1 R7.30 - factorized geometric branch signal

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fa1-r730-factorized-geometry.yml'
      - 'fa1r7.12/source/fa1_r730_*.py'
      - 'fa1r7.12/source/test_fa1_r730_*.py'
      - 'fa1r7.12/source/fa1_r723_diamond.py'
      - 'fa1r7.12/source/fa1_r727_checkpoint.py'
      - 'fa1r7.12/source/fa1_r728_geometric_memory.py'
      - 'fa1r7.12/FA1_R7p30_FACTORIZED_GEOMETRY.md'
      - 'fa1r7.12/R7_CURRENT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa1-r730-master-cpu-source
  cancel-in-progress: false

jobs:
  factorized-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: fa1r7.12/source
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install numpy sentencepiece zstandard
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and verify migration and branch gradients
        run: |
          python -m py_compile fa1r7.12/source/fa1_r730_*.py
          python -m py_compile fa1r7.12/source/fa1_r723_diamond.py
          python -m py_compile fa1r7.12/source/fa1_r727_checkpoint.py
          python -m py_compile fa1r7.12/source/fa1_r728_geometric_memory.py
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r730_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r729_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r728_*.py' -q
      - name: Inherited unified R7 regression suite
        run: |
          python fa1r7.12/source/fa1_r727_suite.py --output "$RUNNER_TEMP/r730_r727_regression.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fa1-r730-source-regressions
          path: ${{ runner.temp }}/r730_r727_regression.json
          retention-days: 30
      - name: Guard
        run: echo 'Source-only CI. Full-checkpoint training must use independent DEV books; TEST remains sealed. No promotion.'
