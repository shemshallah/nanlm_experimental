name: M3 R27 locked R26 independent TEST (one shot)
on:
  push:
    branches: [master]
    paths:
      - 'm3_r27/**'
      - '.github/workflows/m3-r27-frozen-r26-independent-test.yml'

jobs:
  m3-r27-locked-independent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Verify frozen R26 candidate and inherited parent parity
        run: |
          python -m unittest discover -s m3_default -p 'test_*.py' -v
          python -m unittest discover -s m3_r26 -p 'test_*.py' -v
          python -m unittest discover -s m3_r27 -p 'test_*.py' -v
      - name: Recover exact frozen candidate and verify immutable hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r27_parent
          gh run download 44157452299 -R shemshallah/nanlm_experimental \
            -n m3-r26-full-resumable-optimizer-and-dev \
            -D /tmp/m3_r27_parent
          cd /tmp/m3_r27_parent
          printf '%s  %s\n' deb112d4d9b25cb57bd68f689660550a315032bea42c5e9376dbcdeb4a5c97a9 R26_full_adam_checkpoint.npz | sha256sum -c -
          printf '%s  %s\n' 0c65d3b3a8adcb96d2b129076f74eaefc49ee69b61e629be168e5c36d7e20100 R26_DEV.json | sha256sum -c -
      - name: Recover SHA-256-verified NaNROUTER independent books
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r27_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER --dir /tmp/m3_r27_corpus
          cd /tmp/m3_r27_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: Score sealed independent 24 books without optimizer or tuning
        run: |
          python -m m3_r27.locked_test \
            --corpus-root /tmp/m3_r27_corpus \
            --checkpoint /tmp/m3_r27_parent/R26_full_adam_checkpoint.npz \
            --train-report /tmp/m3_r27_parent/R26_DEV.json \
            --output m3_r27/results/R27_LOCKED_TEST.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-r27-one-shot-locked-independent-test
          path: m3_r27/results/
          if-no-files-found: warn
