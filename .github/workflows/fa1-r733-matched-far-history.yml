name: FA1 unified - geometry, causality, and byte validation

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fa1-r733-matched-far-history.yml'
      - 'fa1r7.12/source/fa1_r733_far_history.py'
      - 'fa1r7.12/source/fa1_r735_history_values.py'
      - 'fa1r7.12/source/fa1_r736_deep_wiring.py'
      - 'fa1r7.12/source/fa1_r737_feedback_closure.py'
      - 'fa1r7.12/source/fa1_r738_reliability.py'
      - 'fa1r7.12/source/test_fa1_r738_reliability.py'
      - 'fa1r7.12/FA1_R7p38_RELIABILITY_INTEGRATION.md'
      - 'fa1r7.12/source/fa1_r739_signed_rails.py'
      - 'fa1r7.12/source/test_fa1_r739_signed_rails.py'
      - 'fa1r7.12/FA1_R7p39_SIGNED_RAIL_CPU.md'
      - 'fa1r7.12/source/fa1_r740_rail_calibration.py'
      - 'fa1r7.12/source/test_fa1_r740_rail_calibration.py'
      - 'fa1r7.12/FA1_R7p40_NORMALIZED_RAIL_CPU.md'
      - 'fa1r7.12/source/fa1_r744_causal_word_backoff.py'
      - 'fa1r7.12/source/test_fa1_r744_causal_word_backoff.py'
      - 'fa1r7.12/source/fa1_r744_cpu_pilot.py'
      - 'fa1r7.12/source/fa1_r744_large_dev.py'
      - 'fa1r7.12/source/fa1_r745_geometric_value_read.py'
      - 'fa1r7.12/source/test_fa1_r745_geometric_value_read.py'
      - 'fa1r7.12/source/fa1_r745_cpu_pilot.py'
      - 'fa1r7.12/source/fa1_r745_large_dev_compare.py'
      - 'fa1r7.12/source/fa1_r745_release.py'
      - 'fa1r7.12/FA1_R7p45_CAUSAL_GEOMETRIC_WORD_MEMORY.md'
      - 'fa1r7.12/source/test_fa1_r736_deep_wiring.py'
      - 'fa1r7.12/FA1_R7p36_DEEP_WIRING.md'
      - 'fa1r7.12/source/test_fa1_r735_history_values.py'
      - 'fa1r7.12/source/fa1_r730_factorized_geometry.py'
      - 'fa1r7.12/source/fa1_r723_diamond.py'
      - 'fa1r7.12/source/prepare_document_corpus.py'
      - 'fa1r7.12/FA1_R7p35_HISTORY_VALUE_REPAIR.md'
      - 'fa1r7.12/source/fa1.py'
      - 'fa1r7.12/source/fa1_validation.py'
      - 'fa1r7.12/source/test_fa1_validation.py'
      - 'fa1r7.12/source/test_fa1_feedback.py'
      - 'fa1r7.12/source/fa1_r731_layered_decoder.py'
      - 'fa1r7.12/source/fa1_r732_geometry_calibration.py'
      - 'fa1r7.12/source/fa1_r727_checkpoint.py'
      - 'fa1r7.12/R7_CURRENT.md'
      - 'fa1r7.12/FA1_INPLACE_APEX_FEEDBACK.md'
      - 'fa1r7.12/FA1_R7p34_BYTE_WEIGHTED_BOOTSTRAP.md'
      - 'fa1r7.12/source/test_fa1_r733_far_history.py'
      - 'fa1r7.12/source/fa1_r728_geometric_memory.py'
      - 'fa1r7.12/FA1_R7p33_MATCHED_FAR_HISTORY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa1-unified-master-source
  cancel-in-progress: false

jobs:
  causal-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: fa1r7.12/source
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy sentencepiece zstandard
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run source and migration regressions
        run: |
          python -m py_compile fa1r7.12/source/fa1.py fa1r7.12/source/fa1_validation.py fa1r7.12/source/fa1_r733_far_history.py fa1r7.12/source/fa1_r735_history_values.py fa1r7.12/source/fa1_r736_deep_wiring.py fa1r7.12/source/fa1_r737_feedback_closure.py fa1r7.12/source/fa1_r738_reliability.py fa1r7.12/source/fa1_r739_signed_rails.py fa1r7.12/source/fa1_r740_rail_calibration.py fa1r7.12/source/fa1_r744_causal_word_backoff.py fa1r7.12/source/fa1_r744_cpu_pilot.py fa1r7.12/source/fa1_r744_large_dev.py fa1r7.12/source/fa1_r745_geometric_value_read.py fa1r7.12/source/fa1_r745_cpu_pilot.py fa1r7.12/source/fa1_r745_large_dev_compare.py fa1r7.12/source/fa1_r745_release.py fa1r7.12/source/fa1_r728_geometric_memory.py fa1r7.12/source/fa1_r731_layered_decoder.py fa1r7.12/source/fa1_r732_geometry_calibration.py fa1r7.12/source/fa1_r727_checkpoint.py fa1r7.12/source/fa1_r723_diamond.py fa1r7.12/source/fa1_r730_factorized_geometry.py fa1r7.12/source/prepare_document_corpus.py
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r744_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r745_*.py' -q
          python -m py_compile fa1r7.12/source/fa1_r746_factorial_dev.py fa1r7.12/source/fa1_r747_head_address_copy.py fa1r7.12/source/fa1_r747_cpu_pilot.py fa1r7.12/source/fa1_r747_large_dev.py fa1r7.12/source/fa1_r747_integrity.py fa1r7.12/source/fa1_r747_release.py
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r746_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r747_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r739_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r740_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r738_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r737_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r736_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r735_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_validation.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_feedback.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r733_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r732_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r731_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r730_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r729_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r728_*.py' -q
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r727_*.py' -q
      - name: Protect inherited optimizer contract
        run: python fa1r7.12/source/fa1_r727_suite.py --output "$RUNNER_TEMP/fa1_optimizer_suite.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fa1-unified-source-regression
          path: ${{ runner.temp }}/fa1_optimizer_suite.json
          retention-days: 30
      - name: No automatic promotion
        run: echo 'The accepted step-14,416 checkpoint and sealed TEST books are never touched by source CI.'
