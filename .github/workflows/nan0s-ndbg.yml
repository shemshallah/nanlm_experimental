name: NaN0S NANDBG gates

on:
  workflow_dispatch:
    inputs:
      ref:
        description: nan0s branch, tag, or commit
        required: true
        default: main
      ndbg_ref:
        description: ndbg branch, tag, or commit
        required: true
        default: main

permissions:
  contents: read

jobs:
  ndbg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out nan0s
        uses: actions/checkout@v4
        with:
          repository: shemshallah/nan0s
          ref: ${{ inputs.ref }}
          path: nan0s
      - name: Install gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk qemu-system-x86
      - name: Build host nan_cli
        working-directory: nan0s
        run: make -C aarch64/android nan_cli
      - name: Build the unified image
        working-directory: nan0s
        run: sh tools/build.sh
      - name: Run compiler smoke gates
        working-directory: nan0s
        run: |
          sh tools/ncc_lex.sh
          sh tools/ncc_m1.sh
      - name: Run NANDBG gates
        working-directory: nan0s
        run: |
          sh tools/ndbg.sh
          sh tools/ndbg_diff.sh
          sh tools/ndbg_mon.sh
          sh tools/ndbg_img.sh
          sh tools/ndbg_term.sh
          sh tools/lds_gate.sh

  ndbg-rich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out ndbg
        uses: actions/checkout@v4
        with:
          repository: shemshallah/ndbg
          ref: ${{ inputs.ndbg_ref }}
          path: ndbg
      - name: Install gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk qemu-system-x86
      - name: Build host nan_cli
        working-directory: ndbg
        run: make -C aarch64/android nan_cli
      - name: Run ndbg gates
        working-directory: ndbg
        run: |
          sh tools/ndbg.sh
          sh tools/ndbg_diff.sh
          sh tools/ndbg_mon.sh
          sh tools/ndbg_img.sh
          sh tools/ndbg_gui.sh
          sh tools/lds_gate.sh
