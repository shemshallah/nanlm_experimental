name: NaNCM v83 composite exact ranking regression
on:
  push:
    branches: [nancm-structural-base]
    paths: ['tests/nancm_rank_audit/rank83.py', '.github/workflows/nancm-rank83.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact composite rank and measure explored nodes
        env:
          PYTHONPATH: tests/nancm_folded:tests/nancm_open_bridge:tests/nancm_trajectory:tests/nancm_trajectory70:tests/nancm_context76:tests/nancm_competition77:tests/nancm_hurdle81:tests/nancm_longbyte82
          OMP_NUM_THREADS: '2'
        run: python tests/nancm_rank_audit/rank83.py
