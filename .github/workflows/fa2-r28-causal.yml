name: FA2 R28 - unified recurrent BPTT causal tests
on:
  push:
    paths:
      - 'fa2r19/source/r28_*'
      - 'fa2r19/source/test_r28_recurrent.py'
      - 'fa2r19/source/r23_stream_carry.py'
      - 'fa2r19/source/r24_unified_model.py'
      - '.github/workflows/fa2-r28-causal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r28-causal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify PAL source syntax
        run: python -m compileall -q fa2r19/source
      - name: Install NumPy and CPU PyTorch
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: R27 causal regression
        run: python fa2r19/source/test_r27_trust.py
      - name: R28 recurrent identity and 48-token cross-chunk gradient
        run: python fa2r19/source/test_r28_recurrent.py
