name: NaNCM consolidated checkpoint recovery and symbiosis validation
on:
  push:
    branches: [nancm-structural-base]
    paths: ['.github/workflows/nancm-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nancm-checkpoint-recovery
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: shemshallah/NaNROUTER
    steps:
      - uses: actions/checkout@v4
      - name: Verified public corpus assets (no release API polling)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/{lex,stories,sentences,paragraphs}
          get_archive() {
            local dir="$1" tag="$2" asset="$3" sum="$4"
            (
              cd "data/$dir"
              local base="https://github.com/$REPO/releases/download/$tag"
              curl --fail --location --retry 3 --retry-delay 5 "$base/$asset" -o "$asset"
              curl --fail --location --retry 3 --retry-delay 5 "$base/$sum" -o "$sum"
              sha256sum -c "$sum"
              tar --zstd -xf "$asset"
              rm "$asset"
            )
          }
          get_archive lex wordlist-google-10000-english google-10000-english.tar.zst google-10000-english.SHA256SUMS
          get_archive stories corpora-short-stories-0001 short_stories-0001.tar.zst short_stories-0001.SHA256SUMS
          get_archive sentences corpora-sentences-0001 sentences-0001.tar.zst sentences-0001.SHA256SUMS
          get_archive paragraphs corpora-paragraphs-0001 paragraphs-0001.tar.zst paragraphs-0001.SHA256SUMS
      - name: Install CPU dependencies and compile solver
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          g++ -O3 -std=c++17 -shared -fPIC -fno-fast-math -ffp-contract=off nancm_structural/signed_solver.cpp -o nancm_structural/libsigned.so
          python -m py_compile nancm_structural/hybrid38.py nancm_structural/hybrid39.py nancm_structural/hybrid40.py tests/nancm_retention/pilot44.py
      - name: Recover completed immutable checkpoint chain once
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          # Respect the installation's primary API limit. No gh run watch.
          read -r remaining reset <<< "$(gh api rate_limit --jq '[.resources.core.remaining,.resources.core.reset] | @tsv')"
          if [ "$remaining" -lt 120 ]; then
            delay=$((reset-$(date +%s)+10))
            if [ "$delay" -gt 3600 ]; then echo "API reset exceeds bounded wait"; exit 1; fi
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
          fi
          gh run download 45894184906 -R ${{ github.repository }} -n structural-metrics -D parent
          gh run download 45895870940 -R ${{ github.repository }} -n structural-metrics -D recurrent
          gh run download 45895935296 -R ${{ github.repository }} -n structural-metrics -D direct
          gh run download 45896025621 -R ${{ github.repository }} -n structural-metrics -D dual
          gh run download 45896486886 -R ${{ github.repository }} -n structural-metrics -D symbiotic
          gh run download 45896650014 -R ${{ github.repository }} -n structural-metrics -D fusion
          gh run download 45897647647 -R ${{ github.repository }} -n structural-metrics -D coordinate
          gh run download 45898299393 -R ${{ github.repository }} -n structural-metrics -D temporal
          gh run download 45899583988 -R ${{ github.repository }} -n structural-metrics -D relational
          gh run download 45900374675 -R ${{ github.repository }} -n structural-metrics -D lexical
          gh run download 45900657376 -R ${{ github.repository }} -n structural-metrics -D byte
          gh run download 45903248640 -R ${{ github.repository }} -n structural-metrics -D subword
          gh run download 45903532512 -R ${{ github.repository }} -n structural-metrics -D resonance
          gh run download 45905463861 -R ${{ github.repository }} -n structural-metrics -D attractor
          gh run download 45907255211 -R ${{ github.repository }} -n structural-metrics -D unified
          mkdir -p results/{v38,v39,v40,v44,v49}
      - name: v49 dense scout local parity and learning preflight
        id: v49_checks
        continue-on-error: true
        run: PYTHONPATH=tests/nancm_scout:tests/nancm_retention:tests/nancm_folded:tests/nancm_event_credit python tests/nancm_event_credit/test_dense_scout.py
      - name: v49 full-vocabulary raw-event credit on recovered v37
        id: v49
        if: steps.v49_checks.outcome == 'success'
        continue-on-error: true
        run: python -u tests/nancm_event_credit/pilot49.py --data data --lib nancm_structural/libsigned.so --parent parent/disposable-class-field.npz --recurrent recurrent/recurrent-class-field.npz --direct direct/direct-word-field.npz --dual dual/dual-word-field.npz --symbiotic symbiotic/symbiotic-word-field.npz --fusion fusion/fusion-word-field.npz --coordinate coordinate/coordinate-word-field.npz --temporal temporal/temporal-word-field.npz --relational relational/relational-word-field.npz --lexical lexical/lexical-geometry-field.npz --byte byte/raw-byte-field.npz --subword subword/subword-field.npz --resonance resonance/resonance-field.npz --attractor attractor/attractor-field.npz --unified unified/unified-field.npz --out results/v49/metrics.json
      - name: Retention and causal-basis preflights
        id: retention_checks
        continue-on-error: true
        run: |
          python tests/nancm_retention/adaptive_retention.py
          python tests/nancm_retention/causal_basis.py
      - name: v44 matched adaptive/fixed retention and folded event benchmark
        id: v44
        if: steps.retention_checks.outcome == 'success'
        continue-on-error: true
        run: python -u tests/nancm_retention/pilot44.py --data data --lib nancm_structural/libsigned.so --parent parent/disposable-class-field.npz --recurrent recurrent/recurrent-class-field.npz --direct direct/direct-word-field.npz --dual dual/dual-word-field.npz --symbiotic symbiotic/symbiotic-word-field.npz --fusion fusion/fusion-word-field.npz --coordinate coordinate/coordinate-word-field.npz --temporal temporal/temporal-word-field.npz --relational relational/relational-word-field.npz --lexical lexical/lexical-geometry-field.npz --byte byte/raw-byte-field.npz --subword subword/subword-field.npz --resonance resonance/resonance-field.npz --attractor attractor/attractor-field.npz --out results/v44/retention-metrics.json
      - name: v38 CPU forward/backward parity
        id: v38
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        run: python -u nancm_structural/hybrid38.py --data data --lib nancm_structural/libsigned.so --parent parent/disposable-class-field.npz --recurrent recurrent/recurrent-class-field.npz --direct direct/direct-word-field.npz --dual dual/dual-word-field.npz --symbiotic symbiotic/symbiotic-word-field.npz --fusion fusion/fusion-word-field.npz --coordinate coordinate/coordinate-word-field.npz --temporal temporal/temporal-word-field.npz --relational relational/relational-word-field.npz --lexical lexical/lexical-geometry-field.npz --byte byte/raw-byte-field.npz --subword subword/subword-field.npz --resonance resonance/resonance-field.npz --attractor attractor/attractor-field.npz --unified unified/unified-field.npz --profile cpu --threads 4 --smoke-seconds 120 --out results/v38/metrics.json
      - name: v39 conserved symbiotic corpus law
        id: v39
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        run: python -u nancm_structural/hybrid39.py --data data --lib nancm_structural/libsigned.so --parent parent/disposable-class-field.npz --recurrent recurrent/recurrent-class-field.npz --direct direct/direct-word-field.npz --dual dual/dual-word-field.npz --symbiotic symbiotic/symbiotic-word-field.npz --fusion fusion/fusion-word-field.npz --coordinate coordinate/coordinate-word-field.npz --temporal temporal/temporal-word-field.npz --relational relational/relational-word-field.npz --lexical lexical/lexical-geometry-field.npz --byte byte/raw-byte-field.npz --subword subword/subword-field.npz --resonance resonance/resonance-field.npz --attractor attractor/attractor-field.npz --unified unified/unified-field.npz --profile cpu --threads 4 --out results/v39/metrics.json
      - name: v40 reciprocal feedback on actual recovered v39
        id: v40
        if: steps.v39.outcome == 'success'
        continue-on-error: true
        run: python -u nancm_structural/hybrid40.py --data data --lib nancm_structural/libsigned.so --parent parent/disposable-class-field.npz --recurrent recurrent/recurrent-class-field.npz --direct direct/direct-word-field.npz --dual dual/dual-word-field.npz --symbiotic symbiotic/symbiotic-word-field.npz --fusion fusion/fusion-word-field.npz --coordinate coordinate/coordinate-word-field.npz --temporal temporal/temporal-word-field.npz --relational relational/relational-word-field.npz --lexical lexical/lexical-geometry-field.npz --byte byte/raw-byte-field.npz --subword subword/subword-field.npz --resonance resonance/resonance-field.npz --attractor attractor/attractor-field.npz --unified unified/unified-field.npz --transport results/v39/symbiotic-transport.npz --profile cpu --threads 4 --out results/v40/metrics.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: nancm-consolidated-results
          path: results/
          if-no-files-found: warn
      - name: Report individual stage outcomes
        if: always()
        shell: bash
        run: |
          echo "v44=${{ steps.v44.outcome }} v38=${{ steps.v38.outcome }} v39=${{ steps.v39.outcome }} v40=${{ steps.v40.outcome }}"
          echo "v49=${{ steps.v49.outcome }}"
          test "${{ steps.v49.outcome }}" = success
          test "${{ steps.v44.outcome }}" = success
          test "${{ steps.v38.outcome }}" = success
          test "${{ steps.v39.outcome }}" = success
          test "${{ steps.v40.outcome }}" = success
