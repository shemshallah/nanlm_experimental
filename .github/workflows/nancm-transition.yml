name: NaNCM v61 trainable causal expert transition
on:
  push:
    branches: [nancm-structural-base]
    paths: ['tests/nancm_transition/**', '.github/workflows/nancm-transition.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nancm-transition
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python tests/nancm_crossfit/test_crossfit.py
          python -m py_compile tests/nancm_crossfit/pilot51.py
      - name: Download actual public corpus releases and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/{lex,stories,sentences,paragraphs}
          get_archive() {
            local dir="$1" tag="$2" asset="$3" sum="$4"
            (
              cd "data/$dir"
              local base="https://github.com/shemshallah/NaNROUTER/releases/download/$tag"
              curl --fail --location --retry 3 --retry-delay 5 "$base/$asset" -o "$asset"
              curl --fail --location --retry 3 --retry-delay 5 "$base/$sum" -o "$sum"
              sha256sum -c "$sum"
              tar --zstd -xf "$asset"
              rm "$asset"
            )
          }
          get_archive lex wordlist-google-10000-english google-10000-english.tar.zst google-10000-english.SHA256SUMS
          get_archive stories corpora-short-stories-0001 short_stories-0001.tar.zst short_stories-0001.SHA256SUMS
          get_archive sentences corpora-sentences-0001 sentences-0001.tar.zst sentences-0001.SHA256SUMS
          get_archive paragraphs corpora-paragraphs-0001 paragraphs-0001.tar.zst paragraphs-0001.SHA256SUMS
      - name: Recover completed v50 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45914210629 -R ${{ github.repository }} -n hierarchical-field-diagnostic -D parent
      - name: Recover completed v53 memory credit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45916534576 -R ${{ github.repository }} -n analogy-cooperative-diagnostic -D analogy
      - name: Recover completed v55 contrastive credit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45919146461 -R ${{ github.repository }} -n contrastive-cooperative-diagnostic -D contrast
      - name: Recover exact v57 screened manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45921654373 -R ${{ github.repository }} -n clean-backoff-diagnostic -D screen
      - name: Exact open-vocabulary and folded-event preflight
        run: |
          PYTHONPATH=tests/nancm_folded python tests/nancm_open_bridge/test_open.py
          python tests/nancm_open_bridge/test_skew.py
      - name: Bayesian switching exact path-enumeration preflight
        run: python tests/nancm_switching/test_switch.py
      - name: Exact differentiable transition preflight
        run: python tests/nancm_transition/test_transition.py
      - name: Train exact causal event transition and evaluate screened DEV
        run: OPENBLAS_NUM_THREADS=4 OMP_NUM_THREADS=4 python -u tests/nancm_transition/pilot61.py --data data --checkpoint parent/hierarchical-metrics.pt --analogy analogy/analogy-metrics.pt --contrast contrast/contrastive-metrics.pt --screen screen/clean-backoff-metrics.json --out results/transition.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transition-diagnostic
          path: |
            results/transition.json
            results/transition.pt
