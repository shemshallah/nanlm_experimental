name: M3 R28 promoted R26 unified architecture parity
on:
  push:
    branches: [master]
    paths:
      - 'm3_default/**'
      - 'm3_r21/**'
      - 'm3_r23/**'
      - 'm3_r24/**'
      - 'm3_r25/**'
      - 'm3_r26/**'
      - 'm3_r27/**'
      - '.github/workflows/m3-r28-promoted-default.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Compile canonical and experimental M3 implementations
        run: python -m compileall -q m3_default m3_r20 m3_r21 m3_r22 m3_r23 m3_r24 m3_r25 m3_r26 m3_r27
      - name: Verify frozen R26, R24 and R21 parity and causal regression
        run: |
          python -m unittest discover -s m3_default -p 'test_*.py' -v
          python -m unittest discover -s m3_r20 -p 'test_*.py' -v
          python -m unittest discover -s m3_r21 -p 'test_*.py' -v
          python -m unittest discover -s m3_r22 -p 'test_*.py' -v
          python -m unittest discover -s m3_r23 -p 'test_*.py' -v
          python -m unittest discover -s m3_r24 -p 'test_*.py' -v
          python -m unittest discover -s m3_r25 -p 'test_*.py' -v
          python -m unittest discover -s m3_r26 -p 'test_*.py' -v
          python -m unittest discover -s m3_r27 -p 'test_*.py' -v
