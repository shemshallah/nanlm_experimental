name: NaNCM v84 exact compute reuse
on:
  push:
    branches: [nancm-structural-base]
    paths: ['tests/nancm_compute84/**', '.github/workflows/nancm-compute84.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Exact suffix and frozen-address parity
        env:
          PYTHONPATH: tests/nancm_trajectory:tests/nancm_trajectory70:tests/nancm_context76:tests/nancm_address78
          OMP_NUM_THREADS: '2'
        run: python tests/nancm_compute84/compute84.py
