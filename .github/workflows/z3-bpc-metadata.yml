name: Derive BPC metadata

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Source workflow run ID
        required: true
        type: string

jobs:
  bpc:
    name: Character denominators for zero-shot corpora
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: nanrouter-zero-shot-eval
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-eval
      - name: Compute corpus-character BPC
        run: |
          mkdir -p metadata
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("source-eval")
          eval_payload = json.loads((root / "eval_zero_shot.json").read_text())
          output = {"source_run": None, "corpora": {}}
          total_bits = 0.0
          total_chars = 0
          for name, filename in (
              ("wt2", "wt2_test.txt"),
              ("wt103", "wt103_test.txt"),
          ):
              text = (root / "eval_data" / filename).read_text(
                  encoding="utf-8", errors="ignore"
              )
              chars = len(text)
              metrics = eval_payload["corpora"][name]
              bits = float(metrics["bits_per_token"]) * int(metrics["tokens"])
              bpc = bits / max(1, chars)
              total_bits += bits
              total_chars += chars
              output["corpora"][name] = {
                  "characters": chars,
                  "eval_tokens": int(metrics["tokens"]),
                  "total_bits": bits,
                  "bits_per_char": bpc,
                  "bits_per_byte": metrics["bits_per_byte"],
                  "denominator": "corpus_characters",
              }
          output["aggregate"] = {
              "total_bits": total_bits,
              "characters": total_chars,
              "bits_per_char": total_bits / max(1, total_chars),
              "denominator": "corpus_characters",
          }
          path = Path("metadata/bpc.json")
          path.write_text(json.dumps(output, indent=2, sort_keys=True) + "\n")
          print(json.dumps(output, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nanrouter-bpc-metadata
          path: metadata/bpc.json
          if-no-files-found: error
