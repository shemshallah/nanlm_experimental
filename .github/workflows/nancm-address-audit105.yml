name: NaNCM v105 source-address gate audit
on:
  push:
    branches: [nancm-structural-base]
    paths: ['tests/nancm_address_audit105/**', '.github/workflows/nancm-address-audit105.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nancm-address-audit105
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: tests/nancm_chat96:tests/nancm_chat97:tests/nancm_chat99:tests/nancm_chat100:tests/nancm_chat103
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify source-address field and audit script
        run: |
          python tests/nancm_chat103/field103.py
          python -m py_compile tests/nancm_address_audit105/audit105.py
      - name: Recover exact v103 checkpoint and instruction corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 46174917395 -R "${{ github.repository }}" --json conclusion --jq .conclusion)" = success
          gh run download 46174917395 -R "${{ github.repository }}" -n chat103-checkpoint-and-address-generation -D v103
          curl --fail --location --retry 3 https://huggingface.co/datasets/databricks/databricks-dolly-15k/resolve/main/databricks-dolly-15k.jsonl -o dolly.jsonl
      - name: Test trained source addresses and calibrate gain without changing weights
        run: python -u tests/nancm_address_audit105/audit105.py --checkpoint v103/chat103.pt --metrics v103/chat103.json --data dolly.jsonl --out results/address105.json
      - uses: actions/upload-artifact@v4
        with:
          name: address105-audit
          path: results/address105.json
          if-no-files-found: error
