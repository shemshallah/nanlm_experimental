name: NaNCM v170 native source and ABI smoke
on:
  push:
    branches: [master]
    paths:
      - "experiments/nancm/v169/**"
      - "experiments/nancm/v170/**"
      - ".github/workflows/nancm_v170_native.yml"
  workflow_dispatch:
jobs:
  source-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile v170 causal online module with synthetic parent experts
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -pedantic \
            -Iexperiments/nancm/v170 \
            experiments/nancm/v170/test_source170.cpp -o /tmp/nancm_v170_source_smoke
      - name: Run standalone causal trust and normalization checks
        run: /tmp/nancm_v170_source_smoke
      - name: Explain checkpoint-dependent native gate
        run: |
          echo "PASS synthetic gate/ABI smoke only."
          echo "Full signed-cloud native parity and BPB require the cumulative v170"
          echo "recovery ZIP with original v169 checkpoints, not in source-only Git."
