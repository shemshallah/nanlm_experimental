name: FA2 R25 - causal cache and unified source checks
on:
  push:
    paths:
      - 'fa2r19/source/r25_*'
      - 'fa2r19/source/test_r25_causal.py'
      - 'fa2r19/source/r24_unified_model.py'
      - '.github/workflows/fa2-r25-causal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source syntax
        run: python -m compileall -q fa2r19/source
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify R25 causal candidates, future isolation and identity initialization
        run: python fa2r19/source/test_r25_causal.py
