name: M3 R13 physical wave checks
on:
  push:
    branches: [master]
    paths:
      - 'm3_r13/**'
      - '.github/workflows/m3-r13-wave.yml'
  workflow_dispatch:

jobs:
  deterministic-wave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s m3_r13 -p 'test_*.py' -v
      - run: python m3_r13/wave_diagnostics.py
