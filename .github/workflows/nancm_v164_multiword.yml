name: NaNCM v164 multiword conditional training
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'experiments/nancm/v164_conditional_train.py'
      - '.github/workflows/nancm_v164_multiword.yml'
permissions:
  contents: read
jobs:
  book-conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check zstandard
      - name: Acquire corpus and verify official digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input output
          base=https://github.com/shemshallah/NaNROUTER/releases/download/corpora-short-stories-0004
          curl --fail --location --retry 3 "$base/short_stories-0004.tar.zst" -o input/short_stories-0004.tar.zst
          curl --fail --location --retry 3 "$base/short_stories-0004.SHA256SUMS" -o input/short_stories-0004.SHA256SUMS
          (cd input && sha256sum -c short_stories-0004.SHA256SUMS)
      - name: Train 1-3 word distributions, report independent DEV candidate coverage
        run: python experiments/nancm/v164_conditional_train.py input/short_stories-0004.tar.zst input/short_stories-0004.SHA256SUMS output/ | tee output/CONSOLE.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nancm-v164-distribution
          path: output/
          retention-days: 30
