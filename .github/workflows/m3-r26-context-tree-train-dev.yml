name: M3 R26 checkpoint-continuing context tree TRAIN GATE DEV
on:
  push:
    branches: [master]
    paths:
      - 'm3_r26/**'
      - '.github/workflows/m3-r26-context-tree-train-dev.yml'
  workflow_dispatch:

jobs:
  m3-r26-train-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Verify inherited R24/R25 and new R26 causality/migration
        run: |
          python -m unittest discover -s m3_default -p 'test_*.py' -v
          python -m unittest discover -s m3_r25 -p 'test_*.py' -v
          python -m unittest discover -s m3_r26 -p 'test_*.py' -v
      - name: Recover complete trained R25 optimizer (not zero-initialize)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r26_parent
          gh run download 44125544449 -R shemshallah/nanlm_experimental \
            -n m3-r25-trained-temporal-feedback-dev-optimizer \
            -D /tmp/m3_r26_parent
          ls -lh /tmp/m3_r26_parent/R25_Adam_checkpoint.npz
      - name: Download and verify book-disjoint NaNROUTER corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r26_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER --dir /tmp/m3_r26_corpus
          cd /tmp/m3_r26_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: Resume R25 optimizer and train/evaluate hierarchical class feedback
        run: |
          python -m m3_r26.train_dev \
            --corpus-root /tmp/m3_r26_corpus \
            --parent-checkpoint /tmp/m3_r26_parent/R25_Adam_checkpoint.npz \
            --output m3_r26/results/R26_DEV.json \
            --checkpoint m3_r26/results/R26_full_adam_checkpoint.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-r26-full-resumable-optimizer-and-dev
          path: m3_r26/results/
          if-no-files-found: warn
