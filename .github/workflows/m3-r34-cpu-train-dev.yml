name: M3 R34 one-lineage CPU feedback FIT GATE DEV
on:
  push:
    branches: [master]
    paths:
      - 'm3_r34/train_dev.py'
      - '.github/workflows/m3-r34-cpu-train-dev.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m3-r34-frozen-r32-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Regression and 32-group inherited parity
        run: |
          python -m compileall -q m3_default m3_r32 m3_r34
          python -m unittest discover -s m3_r34 -p 'test_*.py' -v
          printf '%s  %s\n' \
            67e7417fb38c8d914714cee243fb080da6e63cf5f9e9c9737e28a5b168c1da1a \
            m3_default/r32_accepted_checkpoint.npz | sha256sum -c -
      - name: Download and SHA-lock NaNROUTER corpus Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r34_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER \
            --dir /tmp/m3_r34_corpus
          cd /tmp/m3_r34_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: Train four new feedback groups and measure disjoint GATE and DEV
        run: |
          python -m m3_r34.train_dev \
            --corpus-root /tmp/m3_r34_corpus \
            --checkpoint m3_r34/results/R34_36_group_candidate.npz \
            --output m3_r34/results/R34_FIT_GATE_DEV.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-r34-feedback-36-group-candidate-and-disjoint-dev
          path: m3_r34/results/
          if-no-files-found: warn
