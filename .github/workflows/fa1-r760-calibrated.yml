name: FA1 R7.60 support-aware geometric calibration CPU
on:
  push:
    branches: [master]
    paths:
      - 'fa1r7.12/source/fa1_r760_geometric_calibration.py'
      - 'fa1r7.12/source/fa1_r760_cpu_pilot.py'
      - 'fa1r7.12/source/test_fa1_r760_geometric_calibration.py'
      - 'fa1r7.12/source/fa1_r727_checkpoint.py'
      - '.github/workflows/fa1-r760-calibrated.yml'
  workflow_dispatch:

jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify inherited and calibrated geometric source
        run: |
          export PYTHONPATH=fa1r7.12/source
          python -m unittest -q test_fa1_r760_geometric_calibration
          python -m unittest -q test_fa1_r759_geometric_prior
          python -m unittest -q test_fa1_r758_contextual_geometry
