name: M3 R20 signed mirror successor memory DEV
on:
  push:
    branches: [master]
    paths:
      - 'm3_r20/**'
      - '.github/workflows/m3-r20-signed-successor-memory.yml'
  workflow_dispatch:

jobs:
  signed-memory-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Verify frozen M3 ancestry and signed-pair memory tests
        run: |
          python -m unittest discover -s m3_r17 -p 'test_*.py' -v
          python -m unittest discover -s m3_r18 -p 'test_*.py' -v
          python -m unittest discover -s m3_r19 -p 'test_*.py' -v
          python -m unittest discover -s m3_r20 -p 'test_*.py' -v
      - name: Download SHA-256-verified NaNROUTER release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r20_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER --dir /tmp/m3_r20_corpus
          cd /tmp/m3_r20_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: TRAIN-only successor calibration and fresh R20 DEV
        run: |
          python -m m3_r20.successor_dev \
            --corpus-root /tmp/m3_r20_corpus \
            --output m3_r20/results/R20_NaNROUTER_DEV.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-r20-signed-successor-memory-dev
          path: m3_r20/results/R20_NaNROUTER_DEV.json
          if-no-files-found: warn
