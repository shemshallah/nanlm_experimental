name: M3 R24 independent frozen causal-copy TEST
on:
  workflow_dispatch: # Independent TEST already passed; no automatic repeated scoring.

jobs:
  m3-r24-locked-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Verify frozen source and readout exactness
        run: |
          python -m unittest discover -s m3_r23 -p 'test_*.py' -v
          python -m unittest discover -s m3_r24 -p 'test_*.py' -v
      - name: Recover SHA-256-verified NaNROUTER books
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r24_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER --dir /tmp/m3_r24_corpus
          cd /tmp/m3_r24_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: Score previously untouched 24 books, no updates
        run: |
          python -m m3_r24.locked_test \
            --corpus-root /tmp/m3_r24_corpus \
            --output m3_r24/results/R24_NaNROUTER_LOCKED_TEST.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-r24-locked-independent-test-results
          path: m3_r24/results/
          if-no-files-found: warn
