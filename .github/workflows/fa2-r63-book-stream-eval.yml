name: FA2 R63 - Book-Sequential DEV Scoring

on:
  push:
    branches: [master]
    paths:
      - 'poincare_mirror/book_stream_eval.py'
      - 'poincare_mirror/book_successor_stream.py'
      - 'poincare_mirror/tests/test_r62_book_successor_stream.py'
      - 'poincare_mirror/scripts/eval_r63_book_stream.py'
      - 'poincare_mirror/tests/test_r63_book_stream_eval.py'
      - '.github/workflows/fa2-r63-book-stream-eval.yml'
  workflow_dispatch:

jobs:
  honest-book-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile all FA2 source
        run: python -m compileall -q poincare_mirror
      - name: Score every byte once with book-isolated control arms
        run: |
          cd poincare_mirror
          python -m unittest discover -s tests -p 'test_r63_book_stream_eval.py' -v
      - name: R62 causal stream plus inherited memory regressions
        run: |
          cd poincare_mirror
          python -m unittest discover -s tests -p 'test_r62_book_successor_stream.py' -v
          python -m unittest discover -s tests -p 'test_r61_indexed_memory.py' -v
          python -m unittest discover -s tests -p 'test_r60_hierarchical_compound.py' -v
          python -m unittest discover -s tests -p 'test_r59_compound_successor.py' -v
          python -m unittest discover -s tests -p 'test_r58_conditional_successor.py' -v
          python -m unittest discover -s tests -p 'test_r55_pair_successor_train.py' -v
          python -m unittest discover -s tests -p 'test_r54_pair_successor.py' -v

# The full FA2 R58+ checkpoint is not in Actions. These tests use a tiny
# synthetic model: they do not demonstrate Gutenberg predictive improvements.
