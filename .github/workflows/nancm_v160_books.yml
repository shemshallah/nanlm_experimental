name: NaNCM v160 book-disjoint causal association gate
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'experiments/nancm/v160_book_gate.py'
      - '.github/workflows/nancm_v160_books.yml'
permissions:
  contents: read
jobs:
  native-book-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Python dependency
        run: python -m pip install --disable-pip-version-check zstandard
      - name: Download and verify official NaNROUTER book batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input reports
          base="https://github.com/shemshallah/NaNROUTER/releases/download/corpora-short-stories-0004"
          curl --fail --location --retry 3 "$base/short_stories-0004.tar.zst" -o input/short_stories-0004.tar.zst
          curl --fail --location --retry 3 "$base/short_stories-0004.SHA256SUMS" -o input/short_stories-0004.SHA256SUMS
          ( cd input && sha256sum -c short_stories-0004.SHA256SUMS )
      - name: Deterministic book-disjoint training and evaluation
        run: |
          python experiments/nancm/v160_book_gate.py input/short_stories-0004.tar.zst input/short_stories-0004.SHA256SUMS reports | tee reports/CONSOLE.log
      - name: Publish diagnostics and trained index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nancm-v160-book-disjoint-diagnostic
          path: reports/
          retention-days: 30
