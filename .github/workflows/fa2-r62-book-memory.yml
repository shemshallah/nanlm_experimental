name: FA2 R62 - Persistent Book-Local Causal Memory

on:
  push:
    branches: [master]
    paths:
      - 'poincare_mirror/book_successor_stream.py'
      - 'poincare_mirror/pair_successor_memory.py'
      - 'poincare_mirror/poincare_frontier.py'
      - 'poincare_mirror/tests/test_r62_book_successor_stream.py'
      - '.github/workflows/fa2-r62-book-memory.yml'
  workflow_dispatch:

jobs:
  book-causality-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile FA2
        run: python -m compileall -q poincare_mirror
      - name: Book boundary, chunk parity, replay and real-rail feedback
        run: |
          cd poincare_mirror
          python -m unittest discover -s tests -p 'test_r62_book_successor_stream.py' -v
      - name: R54 through R61 inherited regression
        run: |
          cd poincare_mirror
          python -m unittest discover -s tests -p 'test_r54_pair_successor.py' -v
          python -m unittest discover -s tests -p 'test_r55_pair_successor_train.py' -v
          python -m unittest discover -s tests -p 'test_r58_conditional_successor.py' -v
          python -m unittest discover -s tests -p 'test_r59_compound_successor.py' -v
          python -m unittest discover -s tests -p 'test_r60_hierarchical_compound.py' -v
          python -m unittest discover -s tests -p 'test_r61_indexed_memory.py' -v

# Engineering-only parity: no full R58 checkpoint, no real-book predictive claim.
