name: FA2 R49 - Causal History Specificity

on:
  push:
    paths:
      - 'poincare_mirror/scripts/probe_r49_causal_history.py'
      - 'poincare_mirror/tests/test_r49_causal_history.py'
      - 'poincare_mirror/FA2_R49_CAUSAL_HISTORY_20261116.md'
      - '.github/workflows/fa2-r49-causal-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify syntax and R47-R49 causal controls
        working-directory: poincare_mirror
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p 'test_r47_selective_emission.py' -v
          python -m unittest discover -s tests -p 'test_r49_causal_history.py' -v
