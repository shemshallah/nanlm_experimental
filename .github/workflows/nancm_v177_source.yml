name: NaNCM v177 exact prefix-DAG and six-event macro coder
on:
  push:
    branches: [master]
    paths:
      - 'experiments/nancm/v177/**'
      - '.github/workflows/nancm_v177_source.yml'
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python 3 syntax
        run: python3 -m compileall -q experiments/nancm/v177
      - name: Compile and execute exact native sequential prefix DAG
        run: |
          g++ -O2 -std=c++17 -Iexperiments/nancm/v177 experiments/nancm/v177/test_source177.cpp -o /tmp/nancm177_serial
          /tmp/nancm177_serial
      - name: Compile and execute two private byte-worker smoke
        run: |
          g++ -O2 -std=c++17 -pthread -Iexperiments/nancm/v177 experiments/nancm/v177/test_source_parallel177.cpp -o /tmp/nancm177_parallel
          /tmp/nancm177_parallel
      - name: Verify six-macro exclusion-law exact arithmetic coding
        run: |
          PYTHONPATH=experiments/nancm/v176:experiments/nancm/v177 python3 experiments/nancm/v177/test_macro_code177.py
      - name: Verify exact inherited ABI and document performance rejection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('experiments/nancm/v177')
          src=(p/'native_lattice177.cpp').read_text()
          par=(p/'native_parallel177.cpp').read_text()
          for x in ('wf177_verify_batch','wf177_prepare_top5','wf177_sample','nodes.size()<256'):
              assert x in src,x
          for x in ('std::thread','wf170_byte_set_adaptive','wf177_parallel_prefill_top5'):
              assert x in par,x
          assert '#include "../v176/wordfield176_api.cpp"' in (p/'wordfield177_api.cpp').read_text()
          data=json.loads((p/'RESULTS.json').read_text())
          assert data['parallel_rejected']['relative_throughput'] < 1.0
          assert data['cold_cpu']['relative_throughput'] < 1.0
          print('PASS exact P law, serial fallback, and rejected high-RAM worker')
          PY
