name: KVM probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 cpu-checker
          ls -l /dev/kvm || true
          sudo kvm-ok || true
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          echo "--- accel kvm ---"
          timeout 8 qemu-system-x86_64 -accel kvm -cpu host -m 256 -display none -serial none -monitor none -no-reboot -S 2>&1; echo "accel_rc=$?"
          echo "--- enable-kvm max ---"
          timeout 8 qemu-system-x86_64 -enable-kvm -cpu max -m 256 -display none -serial none -monitor none -no-reboot -S 2>&1; echo "enable_rc=$?"
