name: FA2 R68 - Historical Adam Recovery and Multi-Depth Training

on:
  push:
    branches: [master]
    paths:
      - 'poincare_mirror/scripts/train_r68_multidepth.py'
      - 'poincare_mirror/tests/test_r68_multidepth_resume.py'
      - '.github/workflows/fa2-r68-multidepth.yml'
  workflow_dispatch:

jobs:
  strict-optimizer-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU dependencies
        run: python -m pip install --disable-pip-version-check numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Source compile
        run: python -m py_compile poincare_mirror/scripts/train_r68_multidepth.py
      - name: Historical 197-state optimizer roundtrip
        run: cd poincare_mirror && python -m unittest discover -s tests -p 'test_r68_multidepth_resume.py' -v
      - name: Causal source regressions
        run: |
          cd poincare_mirror
          python -m unittest discover -s tests -p 'test_r66_causal_book_train.py' -v
          python -m unittest discover -s tests -p 'test_r67_space_rank_guard.py' -v

# Real TRAIN/DEV data and checkpoint are SHA-protected external artifacts.
# CI validates loader/trainer mechanics, not independent TEST quality.
