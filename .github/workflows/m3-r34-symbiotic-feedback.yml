name: M3 R34 causal symbiotic feedback 36-group source regression
on:
  push:
    branches: [master]
    paths:
      - 'm3_r34/**'
      - '.github/workflows/m3-r34-symbiotic-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m3-r34-feedback-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Verify unified R32 and zero-init R34 feedback
        run: |
          python -m compileall -q m3_default m3_r32 m3_r34
          python -m unittest discover -s m3_default -p 'test_*.py' -v
          python -m unittest discover -s m3_r34 -p 'test_*.py' -v
