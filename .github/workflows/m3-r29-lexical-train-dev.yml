name: M3 R29 frozen R26 lexical successor CPU TRAIN GATE DEV
on:
  push:
    branches: [master]
    paths:
      - 'm3_r29/**'
      - '.github/workflows/m3-r29-lexical-train-dev.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m3-r29-causal-lexical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Verify canonical R26 and proposed R29 causal/migration invariants
        run: |
          python -m compileall -q m3_default m3_r26 m3_r29
          python -m unittest discover -s m3_default -p 'test_*.py' -v
          python -m unittest discover -s m3_r26 -p 'test_*.py' -v
          python -m unittest discover -s m3_r29 -p 'test_*.py' -v
      - name: Recover exact complete R26 checkpoint; retain its fourteen Adam groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r29_parent
          gh run download 44157452299 -R shemshallah/nanlm_experimental \
            -n m3-r26-full-resumable-optimizer-and-dev \
            -D /tmp/m3_r29_parent
          printf '%s  %s\n' \
            deb112d4d9b25cb57bd68f689660550a315032bea42c5e9376dbcdeb4a5c97a9 \
            /tmp/m3_r29_parent/R26_full_adam_checkpoint.npz | sha256sum -c -
      - name: Verify NaNROUTER books from Release assets only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r29_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER \
            --dir /tmp/m3_r29_corpus
          cd /tmp/m3_r29_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: Train eight new lexical coefficients and evaluate new disjoint GATE/DEV
        run: |
          python -m m3_r29.train_dev \
            --corpus-root /tmp/m3_r29_corpus \
            --parent-checkpoint /tmp/m3_r29_parent/R26_full_adam_checkpoint.npz \
            --output m3_r29/results/R29_DEV.json \
            --checkpoint m3_r29/results/R29_full_adam_checkpoint.npz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-r29-lexical-full-adam-and-dev
          path: m3_r29/results/
          if-no-files-found: warn
