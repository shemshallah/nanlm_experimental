name: M3 R19 class-conditional spatial-wave DEV
on:
  push:
    branches: [master]
    paths:
      - 'm3_r19/**'
      - '.github/workflows/m3-r19-class-conditional-wave.yml'
  workflow_dispatch:

jobs:
  train-only-gated-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Verify frozen ancestry and R19 class-conditional software
        run: |
          python -m unittest discover -s m3_r17 -p 'test_*.py' -v
          python -m unittest discover -s m3_r18 -p 'test_*.py' -v
          python -m unittest discover -s m3_r19 -p 'test_*.py' -v
      - name: Fetch checksum-verified NaNROUTER release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r19_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER --dir /tmp/m3_r19_corpus
          cd /tmp/m3_r19_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: Train-only scale screening and fresh book-disjoint R19 DEV
        run: |
          python -m m3_r19.class_conditional_wave \
            --corpus-root /tmp/m3_r19_corpus \
            --output m3_r19/results/R19_NaNROUTER_DEV.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-r19-class-conditional-train-gated-dev
          path: m3_r19/results/R19_NaNROUTER_DEV.json
          if-no-files-found: warn
