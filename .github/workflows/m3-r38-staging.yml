name: M3 R38 R32-parent staged episodic feedback CPU check
on:
  push:
    branches: [master]
    paths:
      - 'm3_r38/**'
      - '.github/workflows/m3-r38-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m3-r38-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Regression and checkpoint hash
        run: |
          python -m compileall -q m3_r38
          python -m unittest discover -s m3_r38 -p 'test_*.py' -v
          printf '%s  %s\n' \
            67e7417fb38c8d914714cee243fb080da6e63cf5f9e9c9737e28a5b168c1da1a \
            m3_default/r32_accepted_checkpoint.npz | sha256sum -c -
      - name: Download and verify NaNROUTER Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/m3_r38_corpus
          gh release download corpora-short-stories-0004 -R shemshallah/NaNROUTER --dir /tmp/m3_r38_corpus
          cd /tmp/m3_r38_corpus
          sha256sum -c short_stories-0004.SHA256SUMS
          tar --zstd -xf short_stories-0004.tar.zst
      - name: 768-update R32-parent staging + existing GATE and DEV
        run: |
          python -m m3_r38.train_r32_staging --corpus-root /tmp/m3_r38_corpus --output-dir m3_r38/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-r38-r32-only-staging-no-promotion
          path: m3_r38/results/
          if-no-files-found: warn