name: FA1 R7.49 - exact pair address and causal sign reliability

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fa1-r749-address-reliability.yml'
      - 'fa1r7.12/source/fa1_r749_*.py'
      - 'fa1r7.12/source/test_fa1_r749_*.py'
      - 'fa1r7.12/source/fa1_r727_checkpoint.py'
      - 'fa1r7.12/source/fa1_r748_mirror_pair_values.py'
      - 'fa1r7.12/FA1_R7p49_CAUSAL_ADDRESS_RELIABILITY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa1-r749-address-reliability-master
  cancel-in-progress: false

jobs:
  causal-address-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: fa1r7.12/source
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install numpy sentencepiece zstandard
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax and causality regressions
        run: |
          python -m py_compile fa1r7.12/source/fa1_r749_*.py fa1r7.12/source/fa1_r727_checkpoint.py
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r749_*.py' -v
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r748_*.py' -v
          python -m unittest discover -s fa1r7.12/source -p 'test_fa1_r747_*.py' -v
      - name: Preserve experimental status
        run: |
          echo 'Source-only CI; no checkpoint promotion or independent TEST access.'
