name: Terminal-RSI unified CPU acceptance

on:
  push:
    branches: [master]
    paths:
      - 'terminal_rsi/**'
      - '.github/workflows/terminal_rsi_cpu.yml'
  workflow_dispatch:

jobs:
  cpu-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Verify archived 600-entry v103 BPE table is bitwise original
        run: |
          python -c "import hashlib,pathlib; p=pathlib.Path('terminal_rsi/reference/nancm_v103_bpe.txt'); assert hashlib.sha256(p.read_bytes()).hexdigest() == 'cff04c727f2d91e3ae3c2f2bdcf0adeca1422c3a8403488d96aaa759440e8ff5', 'Original v103 BPE merge table changed'"
      - name: Causal, gradient, checkpoint and recursive-feedback acceptance
        run: |
          python terminal_rsi/test_unified.py
          python -m unittest terminal_rsi.test_agent_unified -v
          python -m unittest terminal_rsi.test_migrate -v
          python -m unittest terminal_rsi.test_v103_parity -v
          python -m unittest terminal_rsi.test_restore_win_dev -v
          python -m unittest terminal_rsi.test_build_fresh_dev -v
          python -m unittest terminal_rsi.test_blackwell_preflight -v
          python -m unittest terminal_rsi.test_cpu_fresh_start -v
          python -m unittest terminal_rsi.test_original_runner -v
          python -m unittest terminal_rsi.test_original_end_to_end -v
          python -m unittest terminal_rsi.test_verbatim_training -v
          python -m unittest terminal_rsi.test_migrate_verbatim -v
      - name: Measured shared CPU v103 RSI training-step throughput
        run: |
          python -m terminal_rsi.benchmark_cpu_steps --history 32 --batch 2 --warmup 1 --steps 3 --threads 2
          python -m terminal_rsi.benchmark_cpu_steps --history 256 --batch 2 --warmup 1 --steps 3 --threads 1
          python -m terminal_rsi.benchmark_cpu_steps --history 256 --batch 2 --warmup 1 --steps 3 --threads 2
          python -m terminal_rsi.benchmark_cpu_steps --history 256 --batch 2 --warmup 1 --steps 3 --threads 4
          python -m terminal_rsi.plan_blackwell --physical-gib 96
      - name: Existing standalone Terminal-RSI regressions
        run: python -m unittest discover -s terminal_rsi/tests -v
