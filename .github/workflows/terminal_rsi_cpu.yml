name: Terminal-RSI unified CPU acceptance

on:
  push:
    branches: [master]
    paths:
      - 'terminal_rsi/**'
      - '.github/workflows/terminal_rsi_cpu.yml'
  workflow_dispatch:

jobs:
  cpu-first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Causal, gradient, checkpoint and recursive-feedback acceptance
        run: |
          python terminal_rsi/test_unified.py
          python -m unittest terminal_rsi.test_agent_unified -v
          python -m unittest terminal_rsi.test_migrate -v
          python -m unittest terminal_rsi.test_v103_parity -v
          python -m unittest terminal_rsi.test_verbatim_training -v
          python -m unittest terminal_rsi.test_migrate_verbatim -v
      - name: Existing standalone Terminal-RSI regressions
        run: python -m unittest discover -s terminal_rsi/tests -v
