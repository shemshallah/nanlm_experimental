name: FA1 R7.23 - deep Diamond topology and inherited CPU regressions

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fa1-r723-diamond-cpu.yml'
      - 'fa1r7.12/source/fa1_r723_*.py'
      - 'fa1r7.12/source/test_fa1_r723_*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa1-r723-diamond-master
  cancel-in-progress: false

jobs:
  topology-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: fa1r7.12/source
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified CPU dependencies
        run: |
          python -m pip install numpy sentencepiece
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile unified R7.23 and test exact topology / gradients
        run: |
          set -euo pipefail
          python -m py_compile fa1r7.12/source/fa1_r723_diamond.py fa1r7.12/source/fa1_r723_train.py fa1r7.12/source/fa1_r723_corpus.py
          python fa1r7.12/source/test_fa1_r723_topology.py
      - name: Verify inherited R7.18-R7.22 regressions
        run: |
          set -euo pipefail
          python fa1r7.12/source/test_fa1_r718.py
          python fa1r7.12/source/test_fa1_r719.py
          python fa1r7.12/source/test_fa1_r720.py
          python fa1r7.12/source/test_fa1_r721_synthetic.py
          python fa1r7.12/source/test_fa1_r722.py
      - name: State unchanged checkpoint rule
        run: |
          echo 'GitHub source-only job proves topology, differentiability and inherited synthetic parity.'
          echo 'Actual R7.22 94.8MB model and tokenizer remain required for real CPU training.'
          echo 'No training or promotion is performed by this regression workflow.'
